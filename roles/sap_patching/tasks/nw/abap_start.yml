---

- name: SAP Patching - Start ABAP - Set facts with SID variables if required
  ansible.builtin.set_fact:
    __sap_patching_fact_sap_system_sid: "{{ sap_patching_sap_system_sid }}"
    __sap_patching_fact_sidadm_user: "{{ sap_patching_sap_system_sid | lower }}adm"
  when:
    - __sap_patching_fact_sap_system_sid | d('', true) | length == 0
      or __sap_patching_params.task_execution_mode | d('', true) == 'direct'


- name: SAP Patching - Start ABAP - Include tasks to get a list of sapstartsrv instances
  ansible.builtin.include_tasks:
    file: common/sapstartsrv_instances.yml

# Instance list is already verified before this file is executed,
# so we can be sure that there is at least one instance to execute the start on.

- name: Block to start the system
  # StartSystem must be executed from one host only, elected in 'sapstartsrv_instances.yml'.
  when: inventory_hostname == __sap_patching_fact_instance_primary_host
  block:
    - name: SAP Patching - Start ABAP - Execute 'sapcontrol' with function 'StartSystem' to start the system
      ansible.builtin.shell:
        cmd: >-
          source ~/.profile &&
          sapcontrol
          -nr {{ __sap_patching_fact_instance_list[0][1] }}
          -function StartSystem
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ __sap_patching_fact_sidadm_user }}"
      register: __sap_patching_register_start_system
      changed_when: __sap_patching_register_start_system.rc == 0
      failed_when: false  # Fail is handled in the next task, to report the command output.

    - name: SAP Patching - Start ABAP - Fail if 'sapcontrol' with function 'StartSystem' has failed
      ansible.builtin.fail:
        msg: |
          FAIL: The command 'sapcontrol' with function 'StartSystem' has failed for current kernel.
          Command: {{ __sap_patching_register_start_system.cmd | d('') }}
          Output: {{ __sap_patching_register_start_system.stdout | d('') }}
          Error: {{ __sap_patching_register_start_system.stderr | d('') }}
      when:
        - __sap_patching_register_start_system.rc | d(1) != 0
          or 'FAIL' in __sap_patching_register_start_system.stdout | d('')


- name: SAP Patching - Start ABAP - Inform about the wait for the started instances
  ansible.builtin.debug:
    msg: |
      INFO: The whole system was started with a single command from the host '{{ __sap_patching_fact_instance_primary_host }}'.
      Waiting until all instances on the following hosts in play are started: {{ __sap_patching_fact_instance_hosts | join(', ') }}.
  # Shown once from the elected primary host, the same host that initiates the system wide commands.
  when: inventory_hostname == __sap_patching_fact_instance_primary_host


# The function 'WaitforStarted' waits only for the instance it is executed on,
# so every host waits for all of its own instances to ensure that the whole system is started.
- name: Block to wait until all instances are up
  when: __sap_patching_fact_instance_list | d([]) | length > 0
  block:

    # The function does not wait, but fails immediately when the processes of the instance are not
    # running yet, because 'StartSystem' starts the instances of the system by their priority.
    # Therefore the wait is repeated until the instance is started, at most for 35 minutes.
    - name: SAP Patching - Start ABAP - Execute 'sapcontrol' with function 'WaitforStarted' to wait until the instances are started
      ansible.builtin.shell:
        cmd: >-
          source ~/.profile &&
          sapcontrol
          -nr {{ instance_item[1] }}
          -function WaitforStarted 60 5
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ __sap_patching_fact_sidadm_user }}"
      loop: "{{ __sap_patching_fact_instance_list }}"
      loop_control:
        loop_var: instance_item
        label: "Waiting for instance: {{ instance_item[0] }}{{ instance_item[1] }}"
      register: __sap_patching_register_start_system_wait
      retries: 30
      delay: 10
      until: __sap_patching_register_start_system_wait.rc == 0
      changed_when: false  # The command only waits for the state reached by 'StartSystem'.
      failed_when: false  # Fail is handled in the next task, to report the command output.

    - name: SAP Patching - Start ABAP - Fail if 'sapcontrol' with function 'WaitforStarted' has failed
      ansible.builtin.fail:
        msg: |
          FAIL: The command 'sapcontrol' with function 'WaitforStarted' has failed for current kernel.
          Command: {{ wait_item.cmd | d('') }}
          Output: {{ wait_item.stdout | d('') }}
          Error: {{ wait_item.stderr | d('') }}
      loop: "{{ __sap_patching_register_start_system_wait.results | d([]) }}"
      loop_control:
        loop_var: wait_item
        label: "Instance: {{ wait_item.instance_item[0] | d('') }}{{ wait_item.instance_item[1] | d('') }}"
      when:
        - wait_item.rc | d(1) != 0
          or 'FAIL' in wait_item.stdout | d('')


