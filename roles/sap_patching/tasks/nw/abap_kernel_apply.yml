---

# Facts are set here for improved readability, instead of combining all this logic into one jinja2 block.
# Prepare the path to kernel to apply, based on the following logic:
# 1. If the prepare task was executed, use the prepared kernel path.
# 2. If the user did not specify a kernel to apply, use the default symlink path.
# 3. If the user specified a kernel to apply, use the specified path (relative to kernel base or absolute).

- name: SAP Patching - Kernel - Apply - Set fact with kernel to apply if prepare was executed
  ansible.builtin.set_fact:
    __sap_patching_fact_kernel_to_apply:
      "{{ __sap_patching_fact_abap_kernel_to_apply_prepared }}"
  when: __sap_patching_fact_abap_kernel_to_apply_prepared is defined

- name: SAP Patching - Kernel - Apply - Set fact with kernel to apply if not specified by user
  ansible.builtin.set_fact:
    __sap_patching_fact_kernel_to_apply:
      "{{ __sap_patching_kernel_base }}/{{ sap_patching_kernel_to_apply_symlink }}"
  when:
    - __sap_patching_fact_abap_kernel_to_apply_prepared is not defined
    - sap_patching_kernel_to_apply | trim | length == 0

- name: SAP Patching - Kernel - Apply - Set fact with kernel to apply if specified by user
  ansible.builtin.set_fact:
    __sap_patching_fact_kernel_to_apply:
      "{{ __sap_patching_kernel_base ~ '/' ~ sap_patching_kernel_to_apply
        if not sap_patching_kernel_to_apply.startswith('/')
        else sap_patching_kernel_to_apply }}"
  when:
    - __sap_patching_fact_abap_kernel_to_apply_prepared is not defined
    - sap_patching_kernel_to_apply | trim | length > 0


- name: SAP Patching - Kernel - Apply - Execute shared tasks for kernel apply
  ansible.builtin.include_tasks:
    file: common/shared_kernel_apply.yml
  vars:
    __sap_patching_fact_sap_system_sid: "{{ sap_patching_sap_system_sid | upper }}"
    __sap_patching_fact_sidadm_user: "{{ sap_patching_sap_system_sid | lower }}adm"
    __sap_patching_fact_kernel_base: "{{ __sap_patching_kernel_base }}"
    __sap_patching_fact_kernel_type: "abap_kernel"

    # Global exe directory is shared among the ABAP hosts, so it is patched on the primary host only.
    __sap_patching_fact_kernel_apply_once: true


- name: SAP Patching - Kernel - Apply - Inform that the restart step is not part of the execution plan
  ansible.builtin.debug:
    msg: |
      INFO: Step 'abap_kernel_apply' was completed, but the step 'abap_kernel_restart'
      is not part of the current execution plan.
      The kernel files were copied to the global exe directory: {{ __sap_patching_fact_kernel_global_exe }}

      The running SAP processes keep using the previous kernel until the instances are restarted,
      either by the step 'abap_kernel_restart' or manually during a maintenance window.
  when:
    - "'abap_kernel_restart' not in sap_patching_execution_plan"
    - __sap_patching_fact_kernel_installed | d(false)
    - inventory_hostname == __sap_patching_fact_kernel_primary_host
