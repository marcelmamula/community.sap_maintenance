---

# NOTE: Additional methods for detection:
# - Filesystem check with command:
#   ls -d /usr/sap/{{ __sap_patching_fact_sap_system_sid | upper }}/[AED]*/exe/sapstartsrv | awk -F '/' '{print $5}'


# Facts are defaulted unconditionally, so that values from previously executed plan steps are overwritten.
# Without it, a component with no running instances would inherit the instances of another component.
- name: SAP Patching - Detect Instances - Set fact with empty default for detected instances
  ansible.builtin.set_fact:
    __sap_patching_fact_instance_list: []


- name: Block for existing user only
  when: __sap_patching_fact_sidadm_user in ansible_facts['getent_passwd']
  block:

    # NOTE: It is possible to use 'lssap' for detection, but since this executable
    # is not well documented, we are using the more generic 'ps' command to detect running instances of this system.
    # /usr/sap/hostctrl/exe/lssap | grep {{ __sap_patching_fact_sap_system_sid }} | awk -F '|' '{print $2}'

    # Get the raw process list without a shell pipe, so a real error is never masked and there is
    # no reliance on pipefail. Filtering and parsing is done natively in the next task.
    - name: SAP Patching - Detect Instances - Get all running processes of the SID user
      ansible.builtin.command:
        cmd: ps -U {{ __sap_patching_fact_sidadm_user }} -o cmd --no-header
      register: __sap_patching_register_sap_instances
      changed_when: false
      # 'ps -U <user>' exits non-zero with no output when the user runs no processes,
      # e.g. the ABAP <sid>adm user also exists on a HANA host of the same system.
      # That is a valid "no instances" result, so only a real error (non-empty stderr) is fatal.
      failed_when: __sap_patching_register_sap_instances.stderr | length > 0

    # Keep only 'sapstartsrv' processes, drop SUM and HDB, and read the instance directory
    # (e.g. 'ASCS00') from the path, so the system SID is not matched by mistake.
    # Resulting fact is list of lists: [['ASCS', '00'], ['D', '01']]
    - name: SAP Patching - Detect Instances - Set fact with parsed instance types and numbers
      ansible.builtin.set_fact:
        __sap_patching_fact_instance_list: >-
          {{ __sap_patching_register_sap_instances.stdout_lines
             | select('search', 'sapstartsrv')
             | reject('search', 'SUM|HDB')
             | map('regex_search', '/([A-Za-z]+)([0-9]{2})/exe/sapstartsrv', '\1', '\2')
             | reject('none')
             | list }}
      when: __sap_patching_register_sap_instances.stdout_lines | d([]) | length > 0


# List of all hosts, which detected this component, is set on all hosts in the play using 'hostvars'.
# System wide sapcontrol functions (StartSystem, StopSystem, UpdateSystem) must be executed from a single
# host running an instance of this system, which 'run_once' cannot guarantee, because it selects the
# first host of the whole play (e.g. a database server without any instance of this system).
# NOTE: Election relies on the default 'linear' strategy, where all hosts reach this task together.
- name: SAP Patching - Detect Instances - Set fact with hosts in play running instances of this system
  ansible.builtin.set_fact:
    __sap_patching_fact_instance_hosts: >-
      {{ ansible_play_hosts
         | map('extract', hostvars)
         | selectattr('__sap_patching_fact_instance_list', 'defined')
         | rejectattr('__sap_patching_fact_instance_list', 'equalto', [])
         | map(attribute='inventory_hostname')
         | list }}

- name: SAP Patching - Detect Instances - Set fact with the primary host for system wide commands
  ansible.builtin.set_fact:
    __sap_patching_fact_instance_primary_host: "{{ __sap_patching_fact_instance_hosts | first | d('') }}"
