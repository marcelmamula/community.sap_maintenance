---

# Shared task file for both ABAP Kernel and Web Dispatcher Kernel patching.

# Warning with 'run_once', because all hosts in the play have same fact set.
- name: SAP Patching - Kernel - Prepare - Warning if the kernel is not installed on any host in play
  ansible.builtin.debug:
    msg: |
      WARN: No host in play has the kernel installed (the global exe directory is missing or empty), so there is nothing to prepare.
      {% if __sap_patching_fact_kernel_type == 'abap_kernel' %}
      If this is unexpected, ensure that the application servers of the system '{{ __sap_patching_fact_sap_system_sid }}'
      are part of this play and that the variable 'sap_patching_sap_system_sid' matches the installed system.
      {% else %}
      If this is unexpected, ensure that the web dispatcher hosts of the system '{{ __sap_patching_fact_sap_system_sid }}'
      are part of this play and that the variable 'sap_patching_wdp_system_sid' matches the installed system.
      {% endif %}
  run_once: true
  when: __sap_patching_fact_kernel_hosts | length == 0


# Rules for preparation of directories:
# - Base is created on all hosts, or primary host only in shared mode.
# - Base and source are verified on all hosts, to ensure they are visible in shared mode.
# - Retry stat after directory creation to absorb NFS propagation delay in shared mode.

- name: Block for base directory only on hosts where the kernel is installed
  when: __sap_patching_fact_kernel_installed | d(false)
  block:
    - name: SAP Patching - Kernel - Prepare - Stat availability of the base directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_kernel_base }}"
      register: __sap_patching_register_kernel_prepare_base_stat
      when:
        - not __sap_patching_fact_kernel_files_shared
          or inventory_hostname == __sap_patching_fact_kernel_primary_host

    - name: SAP Patching - Kernel - Prepare - Create base directory with user {{ __sap_patching_file_owner | d('') }}
      ansible.builtin.file:
        path: "{{ __sap_patching_fact_kernel_base }}"
        state: directory
        mode: '0755'
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      when:
        - not __sap_patching_fact_kernel_files_shared
          or inventory_hostname == __sap_patching_fact_kernel_primary_host
        - not __sap_patching_register_kernel_prepare_base_stat.stat.exists

    - name: SAP Patching - Kernel - Prepare - Verify availability of the base directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_kernel_base }}"
      register: __sap_patching_register_kernel_prepare_base_stat
      until: __sap_patching_register_kernel_prepare_base_stat.stat.exists
      retries: 6
      delay: 5
      failed_when: false  # Fail is handled in the next task to provide more information.

    - name: SAP Patching - Kernel - Prepare - Fail if the base directory is not available on this host
      ansible.builtin.fail:
        msg: |
          FAIL: The base directory "{{ __sap_patching_fact_kernel_base }}" is not available on this host.
          {% if __sap_patching_fact_kernel_files_shared %}
          It is prepared only on the primary host "{{ __sap_patching_fact_kernel_primary_host }}".
          Ensure the base directory is on a shared filesystem mounted on all hosts,
          {% if __sap_patching_fact_kernel_type == 'abap_kernel' %}
          or set 'sap_patching_kernel_files_shared' to 'false' to prepare it on every host separately.
          {% else %}
          or set 'sap_patching_webdisp_files_shared' to 'false' to prepare it on every host separately.
          {% endif %}
          {% else %}
          Creating the directory failed. Please check the path and the permissions.
          {% endif %}
      when: not __sap_patching_register_kernel_prepare_base_stat.stat.exists

    - name: SAP Patching - Kernel - Prepare - Fail if base directory is not a directory
      ansible.builtin.fail:
        msg: |
          FAIL: The path "{{ __sap_patching_fact_kernel_base }}" exists but it is not a directory.
          {% if __sap_patching_fact_kernel_type == 'abap_kernel' %}
          Please ensure that the path defined in the variable 'sap_patching_kernel_base' is a directory.
          {% else %}
          Please ensure that the path defined in the variable 'sap_patching_webdisp_base' is a directory.
          {% endif %}
      when: not __sap_patching_register_kernel_prepare_base_stat.stat.isdir

    - name: SAP Patching - Kernel - Prepare - Stat base directory with user {{ __sap_patching_file_owner | d('') }}
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_kernel_base }}"
      register: __sap_patching_register_kernel_prepare_base_user_stat
      # Stat with correct user to check permissions.
      become: true
      become_user: "{{ __sap_patching_file_owner }}"

    - name: SAP Patching - Kernel - Prepare - Fail if user cannot write to base directory
      ansible.builtin.fail:
        msg: |
          FAIL: User '{{ __sap_patching_file_owner }}' does not have write permissions
          to the directory '{{ __sap_patching_fact_kernel_base }}'
          {% if __sap_patching_fact_kernel_type == 'abap_kernel' %}
          defined in the variable 'sap_patching_kernel_base'.
          Symlink '{{ sap_patching_kernel_to_apply_symlink }}'
          {% else %}
          defined in the variable 'sap_patching_webdisp_base'.
          Symlink '{{ sap_patching_webdisp_to_apply_symlink }}'
          {% endif %}
          cannot be created without write access to this path.
          Please check the directory permissions (chmod/chown).
      when: not __sap_patching_register_kernel_prepare_base_user_stat.stat.writeable


- name: Block for source directory only on hosts where the kernel is installed
  when: __sap_patching_fact_kernel_installed | d(false)
  block:
    - name: SAP Patching - Kernel - Prepare - Stat availability of the source directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_kernel_source }}"
      register: __sap_patching_register_kernel_prepare_source_stat
      when:
        - not __sap_patching_fact_kernel_files_shared
          or inventory_hostname == __sap_patching_fact_kernel_primary_host

    - name: SAP Patching - Kernel - Prepare - Create source directory with user {{ __sap_patching_file_owner | d('') }}
      ansible.builtin.file:
        path: "{{ __sap_patching_fact_kernel_source }}"
        state: directory
        mode: '0755'
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      when:
        - not __sap_patching_fact_kernel_files_shared
          or inventory_hostname == __sap_patching_fact_kernel_primary_host
        - not __sap_patching_register_kernel_prepare_source_stat.stat.exists

    - name: SAP Patching - Kernel - Prepare - Verify availability of the source directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_kernel_source }}"
      register: __sap_patching_register_kernel_prepare_source_stat
      until: __sap_patching_register_kernel_prepare_source_stat.stat.exists
      retries: 6
      delay: 5
      failed_when: false  # Fail is handled in the next task to provide more information.

    - name: SAP Patching - Kernel - Prepare - Fail if the source directory is not available on this host
      ansible.builtin.fail:
        msg: |
          FAIL: The source directory "{{ __sap_patching_fact_kernel_source }}" is not available on this host.
          {% if __sap_patching_fact_kernel_files_shared %}
          It is prepared only on the primary host "{{ __sap_patching_fact_kernel_primary_host }}".
          Ensure the source directory is on a shared filesystem mounted on all hosts,
          {% if __sap_patching_fact_kernel_type == 'abap_kernel' %}
          or set 'sap_patching_kernel_files_shared' to 'false' to prepare it on every host separately.
          {% else %}
          or set 'sap_patching_webdisp_files_shared' to 'false' to prepare it on every host separately.
          {% endif %}
          {% else %}
          Creating the directory failed. Please check the path and the permissions.
          {% endif %}
      when: not __sap_patching_register_kernel_prepare_source_stat.stat.exists

    - name: SAP Patching - Kernel - Prepare - Fail if source directory is not a directory
      ansible.builtin.fail:
        msg: |
          FAIL: The path "{{ __sap_patching_fact_kernel_source }}" exists but it is not a directory.
          {% if __sap_patching_fact_kernel_type == 'abap_kernel' %}
          Please ensure that the path defined in the variable 'sap_patching_kernel_source' is a directory.
          {% else %}
          Please ensure that the path defined in the variable 'sap_patching_webdisp_source' is a directory.
          {% endif %}
      when: not __sap_patching_register_kernel_prepare_source_stat.stat.isdir


    # Copy to multiple targets can saturate the control node and the network.
    # Run on the elected primary host in shared mode, or on every host in per-host mode.
    # Throttle comes into effect only in per-host mode, where every host copies its own source directory.
    - name: Block for local source directory
      throttle: "{{ 0 if sap_patching_disable_throttle | d(false) else 1 }}"
      when:
        - __sap_patching_fact_kernel_installed | d(false)
        - not __sap_patching_fact_kernel_files_on_target
        - not __sap_patching_fact_kernel_files_shared
          or inventory_hostname == __sap_patching_fact_kernel_primary_host
      block:
        - name: SAP Patching - Kernel - Prepare - Stat availability of the local source directory
          ansible.builtin.stat:
            path: "{{ __sap_patching_fact_kernel_source_local }}"
          delegate_to: localhost  # Stat should be executed on control node where the files are located
          register: __sap_patching_register_kernel_source_local_stat

        - name: SAP Patching - Kernel - Prepare - Fail if local source directory does not exist
          ansible.builtin.fail:
            msg: |
              FAIL: The path "{{ __sap_patching_fact_kernel_source_local }}" does not exist or is not a directory.
              Please ensure that the kernel source path is correct and accessible.
          when: not (__sap_patching_register_kernel_source_local_stat.stat.exists
                  and __sap_patching_register_kernel_source_local_stat.stat.isdir)

        - name: SAP Patching - Kernel - Prepare - Inform about the copy from the control node
          ansible.builtin.debug:
            msg: |
              INFO: Copying the kernel source files from the control node to the managed node "{{ inventory_hostname }}".
              Source (control node): {{ __sap_patching_fact_kernel_source_local }}
              Target (managed node): {{ __sap_patching_fact_kernel_source }}

              {% if __sap_patching_fact_kernel_type == 'abap_kernel' %}
              The files are copied because 'sap_patching_kernel_files_on_target' is 'false'.
              {% else %}
              The files are copied because 'sap_patching_webdisp_files_on_target' is 'false'.
              {% endif %}
              Set it to 'true' when the files are already present on the managed nodes.
              {% if __sap_patching_fact_kernel_files_shared %}
              The staging area is shared, so this copy runs only once,
              on the primary host "{{ __sap_patching_fact_kernel_primary_host }}".
              {% else %}
              The staging area is not shared, so this copy runs on every host where the kernel is installed.
              {% endif %}

              NOTE: This task reports no progress and Ansible may seem unresponsive until the copy completes.
              The duration depends on the size of the files and the network speed between the control node
              and the managed node.

        - name: SAP Patching - Kernel - Prepare - Copy source files from control node to managed node
          ansible.builtin.copy:
            src: "{{ __sap_patching_fact_kernel_source_local }}/"  # Trailing slash is required.
            dest: "{{ __sap_patching_fact_kernel_source }}/"
            remote_src: false  # Copy from control node
            mode: '0755'
            owner: "{{ __sap_patching_file_owner }}"
            group: "{{ sap_patching_file_group }}"


# Search for kernel SAR files and extract support package number.
# Limited to hosts where the kernel is installed, so it is not searched on hosts of other roles.
- name: SAP Patching - Kernel - Prepare - Find SAR files in the source directory (case-insensitive)
  ansible.builtin.find:
    paths: "{{ __sap_patching_fact_kernel_source }}"
    patterns: "{{ __sap_patching_fact_kernel_find_patterns }}"
    use_regex: true
    file_type: file
    recurse: false
  register: __sap_patching_register_kernel_source_dir_content
  when: __sap_patching_fact_kernel_installed | d(false)
