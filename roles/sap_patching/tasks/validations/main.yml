---

- name: SAP Patching - Validation - Assert that the variable 'sap_patching_execution_plan' is defined as non-empty list
  ansible.builtin.assert:
    that:
      - sap_patching_execution_plan is defined
      - sap_patching_execution_plan | type_debug == 'list'
      - sap_patching_execution_plan | length > 0
    fail_msg: |
      {% if sap_patching_execution_plan is not defined %}
        FAIL: The 'sap_patching_execution_plan' variable must be defined as non-empty list.
      {% elif sap_patching_execution_plan | type_debug != 'list' %}
        FAIL: The 'sap_patching_execution_plan' variable must be a list,
        but it is of type '{{ sap_patching_execution_plan | type_debug }}'.
      {% else %}
        FAIL: The 'sap_patching_execution_plan' variable cannot be an empty list.
      {% endif %}

- name: SAP Patching - Validation - Assert that the variables with suffix 'to_apply_symlink' are defined as non-empty strings
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', var_item, default='SAP_PATCHING_UNDEFINED_VARIABLE_DETECTED') != 'SAP_PATCHING_UNDEFINED_VARIABLE_DETECTED'
      - lookup('ansible.builtin.vars', var_item) is string
      - lookup('ansible.builtin.vars', var_item) | trim | length > 0
    fail_msg: |
      {% if lookup('ansible.builtin.vars', var_item, default='SAP_PATCHING_UNDEFINED_VARIABLE_DETECTED') == 'SAP_PATCHING_UNDEFINED_VARIABLE_DETECTED' %}
        FAIL: The variable '{{ var_item }}' is undefined.
      {% elif lookup('ansible.builtin.vars', var_item) is not string %}
        FAIL: The variable '{{ var_item }}' is not a String.
      {% else %}
        FAIL: The variable '{{ var_item }}' is empty.
      {% endif %}
        It should be the name of the symbolic link pointing to the kernel folder to be used by the patching process.
    quiet: true
  loop:
    - sap_patching_kernel_to_apply_symlink
    - sap_patching_hdb_client_to_apply_symlink
    - sap_patching_hdb_server_to_apply_symlink
    - sap_patching_host_agent_to_apply_symlink
    - sap_patching_webdisp_to_apply_symlink
  loop_control:
    loop_var: var_item


# Gather list of available users and groups to validate when those variables are defined.
- name: SAP Patching - Validation - Get details about available users
  ansible.builtin.getent:
    database: passwd
  failed_when: false  # Using filter can cause failure, but this is left only for validation purposes.

- name: SAP Patching - Validation - Get details about available groups
  ansible.builtin.getent:
    database: group
  failed_when: false  # Using filter can cause failure, but this is left only for validation purposes.


# The primary SID is mandatory for every run and drives the owner of the staging files,
# so it is validated once here instead of in each component validator.
- name: SAP Patching - Validation - Assert that the variable 'sap_patching_sap_system_sid' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_sap_system_sid is defined
      - sap_patching_sap_system_sid is string
      - sap_patching_sap_system_sid | trim | length == 3
    fail_msg: |
      The variable 'sap_patching_sap_system_sid' is undefined, not 3 characters long or invalid.
      It should be a valid SAP system SID string of 3 characters.


- name: SAP Patching - Validation - Assert that the variable 'sap_patching_sapcar_on_target' is defined as boolean
  ansible.builtin.assert:
    that:
      - sap_patching_sapcar_on_target is defined
      - sap_patching_sapcar_on_target is boolean
    fail_msg: |
      The variable 'sap_patching_sapcar_on_target' is undefined or invalid.
      It should be a boolean describing if the SAPCAR executable is already present on the managed nodes.

- name: SAP Patching - Validation - Assert that the variable 'sap_patching_sapcar_path_local' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_sapcar_path_local is defined
      - sap_patching_sapcar_path_local is string
      - sap_patching_sapcar_path_local | trim | length > 0
    fail_msg: |
      The variable 'sap_patching_sapcar_path_local' is undefined, empty or invalid.
      It should be the path to the directory with the SAPCAR executable on the control node.
  when: not sap_patching_sapcar_on_target


# The owner of the staging files is uniform across the play, so it is validated once here,
# but only when the plan contains a step that creates files owned by it.
# The optional copy of the SAPCAR executable from the control node is executed inside,
# because it requires the validated owner and the copied file is validated afterwards.
- name: SAP Patching - Validation - Validate the ownership of the patching files
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/validations/file_ownership.yml"
  when: sap_patching_execution_plan | intersect(__sap_patching_file_owning_steps) | length > 0


# Task dependent variables are validated in their respective validation files (e.g. hdb_server.yml, hdb_client.yml, host_agent.yml)
- name: SAP Patching - Validation - Execute validation specific to each step in the execution plan
  ansible.builtin.include_tasks:
    file: plan_step.yml
  loop: "{{ sap_patching_execution_plan }}"
  loop_control:
    label: "Validating step: {{ __sap_patching_step | d('N/A') }}"
    loop_var: __sap_patching_step
