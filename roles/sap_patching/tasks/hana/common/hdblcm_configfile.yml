---

# This task file was inspired by the Ansible Role 'community.sap_install.sap_hana_install'.

- name: SAP Patching - hdblcm configfile - Get hdblcm version output
  ansible.builtin.command:
    cmd: "{{ __sap_patching_fact_hdb_server_to_apply }}/hdblcm --version"
  register: __sap_patching_register_hdb_version_output
  changed_when: false
  failed_when: false  # Fail is handled in the next tasks to provide more information.

- name: SAP Patching - hdblcm configfile - Set fact with Git Hash of hdblcm version
  ansible.builtin.set_fact:
    __sap_patching_fact_hdb_hdblcm_git_hash_version: >-
      {{ (__sap_patching_register_hdb_version_output.stdout_lines | d([])) |
        select('match', '^GitHash\s*:\s*') |
        map('split', ':') | map('last') | map('trim') | first | d('', true) }}
  when:
    - __sap_patching_register_hdb_version_output.rc is defined
    - __sap_patching_register_hdb_version_output.rc == 0

- name: SAP Patching - hdblcm configfile - Fail if Git Hash of hdblcm version could not be determined
  ansible.builtin.fail:
    msg: |
      FAIL: The command 'hdblcm --version' has failed and the Git Hash of hdblcm version could not be determined.
      Command: {{ __sap_patching_register_hdb_version_output.cmd | d('') }}
      Output: {{ __sap_patching_register_hdb_version_output.stdout | d('') }}
      Error: {{ __sap_patching_register_hdb_version_output.stderr | d('') }}
  when:
    - __sap_patching_register_hdb_version_output.rc != 0
      or __sap_patching_fact_hdb_hdblcm_git_hash_version | d('', true) | trim | length == 0


- name: SAP Patching - hdblcm configfile - Set fact with config file location
  ansible.builtin.set_fact:
    __sap_patching_fact_hdb_hdblcm_configfile:
      "{{ __sap_patching_fact_hdb_server_to_apply }}/ansible_templates/{{ __sap_patching_fact_hdb_hdblcm_git_hash_version }}/{{ __file_name }}"
    __sap_patching_fact_hdb_hdblcm_configfile_dir:
      "{{ __sap_patching_fact_hdb_server_to_apply }}/ansible_templates/{{ __sap_patching_fact_hdb_hdblcm_git_hash_version }}"
  vars:
    __file_name: >-
      {{ __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_hdb_hsr_site[0]] ~ '_hdblcm_configfile.cfg'
        if __sap_patching_fact_hdb_hsr_enabled | d(false)
        else ansible_facts['hostname'] ~ '_hdblcm_configfile.cfg' }}


- name: SAP Patching - hdblcm configfile - Create the hdblcm configfile directory
  ansible.builtin.file:
    path: "{{ __sap_patching_fact_hdb_hdblcm_configfile_dir }}"
    state: directory
    mode: '0755'

- name: SAP Patching - hdblcm configfile - Stat availability of the hdblcm configfile
  ansible.builtin.stat:
    path: "{{ __sap_patching_fact_hdb_hdblcm_configfile }}"
  check_mode: false
  register: __sap_patching_register_hdb_hdblcm_configfile_stat

- name: SAP Patching - hdblcm configfile - Inform what hdblcm configfile will be used
  ansible.builtin.debug:
    msg: |
      {% if __sap_patching_register_hdb_hdblcm_configfile_stat.stat.exists %}
      INFO: Existing hdblcm configfile will be used: '{{ __sap_patching_fact_hdb_hdblcm_configfile }}'.
      {% else %}
      INFO: No existing hdblcm configfile found. A new one will be created at '{{ __sap_patching_fact_hdb_hdblcm_configfile }}'.
      {% endif %}

  # - name: SAP HANA Pre Install - Make the existing static hdblcm configfile available for the SAP HANA installation
  #   ansible.builtin.copy:
  #     src: "{{ sap_hana_install_configfile_directory }}/configfile.cfg"
  #     dest: "{{ __sap_hana_install_register_tmpdir.path }}/configfile.cfg"
  #     remote_src: true
  #     owner: 'root'
  #     group: 'root'
  #     mode: '0755'
  #   when: __sap_patching_register_hdb_hdblcm_configfile_stat.stat.exists


- name: Block to create the hdblcm configfile dynamically
  when: not __sap_patching_register_hdb_hdblcm_configfile_stat.stat.exists
  block:

    - name: SAP Patching - hdblcm configfile - Create the hdblcm configfile template file
      ansible.builtin.command:
        cmd: >-
          {{ __sap_patching_fact_hdb_server_to_apply }}/hdblcm
          --dump_configfile_template={{ __sap_patching_fact_hdb_hdblcm_configfile }}.template
      register: __sap_patching_register_hdb_hdblcm_configfile_template
      changed_when: false


    - name: SAP Patching - hdblcm configfile - Read generated hdblcm configfile template
      ansible.builtin.slurp:
        src: "{{ __sap_patching_fact_hdb_hdblcm_configfile }}.template"
      register: __sap_patching_register_hdb_hdblcm_configfile_template_slurp

    # This task parses the original .template file line-by-line to dynamically generate a .j2 template.
    # This generated template is later used to deploy the final hdblcm configuration file.
    # - Any line NOT starting with [a-z] is written to the .j2 template completely unmodified,
    #   preserving the original formatting and comments.
    # - Transforms lines containing hdblcm variables into dynamic Jinja2 syntax:
    #   Format: <parameter>={{ sap_patching_hdb_server_cf_<parameter> | d('<default>') }}
    - name: SAP Patching - hdblcm configfile - Create a Jinja2 template from the hdblcm configfile template
      ansible.builtin.copy:
        dest: "{{ __sap_patching_fact_hdb_hdblcm_configfile }}.j2"
        content: |
          # Managed by the Ansible Role 'sap_patching'.
          #
          {% for line in (__sap_patching_register_hdb_hdblcm_configfile_template_slurp.content | b64decode).splitlines() %}
          {% if line is match('^[a-z]') %}
          {% set parts = line.split('=', 1) %}
          {{ parts[0] }}={{ '{{' }} sap_patching_hdb_server_cf_{{ parts[0] | trim }} | d('{{ parts[1] | d('') | trim }}') {{ '}}' }}
          {% else %}
          {{ line }}
          {% endif %}
          {% endfor %}
        mode: '0644'


    # The template module reads the source from the control node, so the generated jinja2 template
    # is fetched into a temporary file which is removed once the configfile is created.
    - name: SAP Patching - hdblcm configfile - Create a temporary file for the jinja2 template on the control node
      ansible.builtin.tempfile:
        state: file
        suffix: .j2
      delegate_to: localhost
      register: __sap_patching_register_hdb_hdblcm_configfile_tempfile

    - name: Block to generate the hdblcm configfile from the fetched jinja2 template
      block:
        - name: SAP Patching - hdblcm configfile - Fetch jinja2 template from managed node to control node
          ansible.builtin.fetch:
            src: "{{ __sap_patching_fact_hdb_hdblcm_configfile }}.j2"
            dest: "{{ __sap_patching_register_hdb_hdblcm_configfile_tempfile.path }}"
            flat: true

        - name: SAP Patching - hdblcm configfile - Generate hdblcm configfile using jinja2 template
          ansible.builtin.template:
            src: "{{ __sap_patching_register_hdb_hdblcm_configfile_tempfile.path }}"
            dest: "{{ __sap_patching_fact_hdb_hdblcm_configfile }}"
            mode: '0644'
      always:
        - name: SAP Patching - hdblcm configfile - Remove the temporary file for the jinja2 template from the control node
          ansible.builtin.file:
            path: "{{ __sap_patching_register_hdb_hdblcm_configfile_tempfile.path }}"
            state: absent
          delegate_to: localhost
