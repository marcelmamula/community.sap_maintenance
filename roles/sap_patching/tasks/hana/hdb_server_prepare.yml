# SPDX-License-Identifier: Apache-2.0
---

- name: SAP Patching - HDB Server - Prepare - Detect hosts where the HDB server is installed
  ansible.builtin.include_tasks:
    file: hdb_server_detect.yml


# Warning with 'run_once', because all hosts in the play have same fact set.
- name: SAP Patching - HDB Server - Prepare - Warning if the HDB server is not installed on any host in play
  ansible.builtin.debug:
    msg: |
      WARN: The HDB server was not found on any host in play, so there is nothing to prepare.
      If this is unexpected, ensure that the HDB server hosts are part of this play
      and that the path "{{ sap_patching_hdb_server_install_path }}" is correct.
  run_once: true
  when: __sap_patching_fact_hdb_server_hosts | length == 0


# Rules for preparation of directories:
# - Base is created on all hosts, or primary host only in shared mode.
# - Base and source are verified on all hosts, to ensure they are visible in shared mode.
# - Retry stat after directory creation to absorb NFS propagation delay in shared mode.

- name: Block for base directory only on hosts where the HDB server is installed
  when: __sap_patching_fact_hdb_server_installed | d(false)
  block:
    - name: SAP Patching - HDB Server - Prepare - Stat availability of the base directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_hdb_server_base }}"
      register: __sap_patching_register_hdb_server_prepare_base_stat
      when:
        - not sap_patching_hdb_server_files_shared
          or inventory_hostname == __sap_patching_fact_hdb_server_primary_host

    - name: SAP Patching - HDB Server - Prepare - Create base directory with user {{ __sap_patching_file_owner | d('') }}
      ansible.builtin.file:
        path: "{{ __sap_patching_hdb_server_base }}"
        state: directory
        mode: '0755'
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      when:
        - not sap_patching_hdb_server_files_shared
          or inventory_hostname == __sap_patching_fact_hdb_server_primary_host
        - not __sap_patching_register_hdb_server_prepare_base_stat.stat.exists

    - name: SAP Patching - HDB Server - Prepare - Verify availability of the base directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_hdb_server_base }}"
      register: __sap_patching_register_hdb_server_prepare_base_stat
      until: __sap_patching_register_hdb_server_prepare_base_stat.stat.exists
      retries: 6
      delay: 5
      failed_when: false  # Fail is handled in the next task to provide more information.

    - name: SAP Patching - HDB Server - Prepare - Fail if the base directory is not available on this host
      ansible.builtin.fail:
        msg: |
          FAIL: The base directory "{{ __sap_patching_hdb_server_base }}" is not available on this host.
          {% if sap_patching_hdb_server_files_shared %}
          It is prepared only on the primary host "{{ __sap_patching_fact_hdb_server_primary_host }}".
          Ensure the base directory is on a shared filesystem mounted on all hosts,
          or set 'sap_patching_hdb_server_files_shared' to 'false' to prepare it on every host separately.
          {% else %}
          Creating the directory failed. Please check the path and the permissions.
          {% endif %}
      when: not __sap_patching_register_hdb_server_prepare_base_stat.stat.exists

    - name: SAP Patching - HDB Server - Prepare - Fail if base directory is not a directory
      ansible.builtin.fail:
        msg: |
          FAIL: The path "{{ __sap_patching_hdb_server_base }}" exists but it is not a directory.
          Please ensure that the path defined in the variable 'sap_patching_hdb_server_base' is a directory.
      when: not __sap_patching_register_hdb_server_prepare_base_stat.stat.isdir

    - name: SAP Patching - HDB Server - Prepare - Stat base directory with user {{ __sap_patching_file_owner | d('') }}
      ansible.builtin.stat:
        path: "{{ __sap_patching_hdb_server_base }}"
      register: __sap_patching_register_hdb_server_prepare_base_user_stat
      # Stat with correct user to check permissions.
      become: true
      become_user: "{{ __sap_patching_file_owner }}"

    - name: SAP Patching - HDB Server - Prepare - Fail if user cannot write to base directory
      ansible.builtin.fail:
        msg: |
          FAIL: User '{{ __sap_patching_file_owner }}' does not have write permissions
          to the directory '{{ __sap_patching_hdb_server_base }}'
          defined in the variable 'sap_patching_hdb_server_base'.

          Ansible cannot create the symlink '{{ sap_patching_hdb_server_to_apply_symlink }}' without write access to this path.
          Please check the directory permissions (chmod/chown).
      when: not __sap_patching_register_hdb_server_prepare_base_user_stat.stat.writeable


- name: Block for source directory only on hosts where the HDB server is installed
  when: __sap_patching_fact_hdb_server_installed | d(false)
  block:
    - name: SAP Patching - HDB Server - Prepare - Stat availability of the source directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_hdb_server_source }}"
      register: __sap_patching_register_hdb_server_prepare_source_stat
      when:
        - not sap_patching_hdb_server_files_shared
          or inventory_hostname == __sap_patching_fact_hdb_server_primary_host

    - name: SAP Patching - HDB Server - Prepare - Create source directory with user {{ __sap_patching_file_owner | d('') }}
      ansible.builtin.file:
        path: "{{ __sap_patching_hdb_server_source }}"
        state: directory
        mode: '0755'
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      when:
        - not sap_patching_hdb_server_files_shared
          or inventory_hostname == __sap_patching_fact_hdb_server_primary_host
        - not __sap_patching_register_hdb_server_prepare_source_stat.stat.exists

    - name: SAP Patching - HDB Server - Prepare - Verify availability of the source directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_hdb_server_source }}"
      register: __sap_patching_register_hdb_server_prepare_source_stat
      until: __sap_patching_register_hdb_server_prepare_source_stat.stat.exists
      retries: 6
      delay: 5
      failed_when: false  # Fail is handled in the next task to provide more information.

    - name: SAP Patching - HDB Server - Prepare - Fail if the source directory is not available on this host
      ansible.builtin.fail:
        msg: |
          FAIL: The source directory "{{ __sap_patching_hdb_server_source }}" is not available on this host.
          {% if sap_patching_hdb_server_files_shared %}
          It is prepared only on the primary host "{{ __sap_patching_fact_hdb_server_primary_host }}".
          Ensure the source directory is on a shared filesystem mounted on all hosts,
          or set 'sap_patching_hdb_server_files_shared' to 'false' to prepare it on every host separately.
          {% else %}
          Creating the directory failed. Please check the path and the permissions.
          {% endif %}
      when: not __sap_patching_register_hdb_server_prepare_source_stat.stat.exists

    - name: SAP Patching - HDB Server - Prepare - Fail if source directory is not a directory
      ansible.builtin.fail:
        msg: |
          FAIL: The path "{{ sap_patching_hdb_server_source }}" exists but it is not a directory.
          Please ensure that the path defined in the variable 'sap_patching_hdb_server_source' is a directory.
      when: not __sap_patching_register_hdb_server_prepare_source_stat.stat.isdir


    # Copy to multiple targets can saturate the control node and the network.
    # Run on the elected primary host in shared mode, or on every host in per-host mode.
    # Throttle comes into effect only in per-host mode, where every host copies its own source directory.
    - name: Block for local source directory
      throttle: "{{ 0 if sap_patching_disable_throttle | d(false) else 1 }}"
      when:
        - not sap_patching_hdb_server_files_on_target
        - not sap_patching_hdb_server_files_shared
          or inventory_hostname == __sap_patching_fact_hdb_server_primary_host
      block:
        - name: SAP Patching - HDB Server - Prepare - Stat availability of the local source directory
          ansible.builtin.stat:
            path: "{{ __sap_patching_hdb_server_source_local }}"
          delegate_to: localhost  # Stat should be executed on control node where the files are located
          register: __sap_patching_register_hdb_server_source_local_stat

        - name: SAP Patching - HDB Server - Prepare - Fail if local source directory does not exist
          ansible.builtin.fail:
            msg: |
              FAIL: The path "{{ sap_patching_hdb_server_source_local }}" does not exist or is not a directory.
              Please ensure that the HDB server source path is correct and accessible.
          when: not (__sap_patching_register_hdb_server_source_local_stat.stat.exists
                  and __sap_patching_register_hdb_server_source_local_stat.stat.isdir)

        - name: SAP Patching - HDB Server - Prepare - Inform about the copy from the control node
          ansible.builtin.debug:
            msg: |
              INFO: Copying the HDB server source files from the control node to the managed node "{{ inventory_hostname }}".
              Source (control node): {{ __sap_patching_hdb_server_source_local }}
              Target (managed node): {{ __sap_patching_hdb_server_source }}

              The files are copied because 'sap_patching_hdb_server_files_on_target' is 'false'.
              Set it to 'true' when the files are already present on the managed nodes.
              {% if sap_patching_hdb_server_files_shared %}
              The staging area is shared, so this copy runs only once,
              on the primary host "{{ __sap_patching_fact_hdb_server_primary_host }}".
              {% else %}
              The staging area is not shared, so this copy runs on every host where the HDB server is installed.
              {% endif %}

              NOTE: This task reports no progress and Ansible may seem unresponsive until the copy completes.
              The duration depends on the size of the files and the network speed between the control node
              and the managed node.

        - name: SAP Patching - HDB Server - Prepare - Copy source files from control node to managed node
          ansible.builtin.copy:
            src: "{{ __sap_patching_hdb_server_source_local }}/"  # Trailing slash is required.
            dest: "{{ __sap_patching_hdb_server_source }}/"
            remote_src: false  # Copy from control node
            mode: '0755'
            owner: "{{ __sap_patching_file_owner }}"
            group: "{{ sap_patching_file_group }}"


# Search for HDB server SAR files and extract support package number.
# Limited to hosts where the HDB server is installed, so it is not searched on hosts of other roles.
- name: SAP Patching - HDB Server - Prepare - Find SAR files in the source directory (case-insensitive)
  ansible.builtin.find:
    paths: "{{ __sap_patching_hdb_server_source }}"
    patterns: ['(?i)IMDB_SERVER.*\.SAR$']
    use_regex: true
    file_type: file
    recurse: false
  register: __sap_patching_register_hdb_server_source_dir_content
  when: __sap_patching_fact_hdb_server_installed | d(false)


- name: Block to execute only if SAR files were found
  # Preparation runs only on hosts where the HDB server is installed. With a shared staging area it is
  # limited further to the elected primary host, so extraction happens exactly once. With a per-host
  # staging area every installed host extracts its own copy.
  when:
    - __sap_patching_fact_hdb_server_installed | d(false)
    - not sap_patching_hdb_server_files_shared
      or inventory_hostname == __sap_patching_fact_hdb_server_primary_host
    - __sap_patching_register_hdb_server_source_dir_content.matched | d(0) > 0
  block:

     # In case there are more than one SAR files, get the latest one based on the filename sort.
    - name: SAP Patching - HDB Server - Prepare - Set fact with the latest HDB server SAR filename
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_server_sar: >-
          {{
            __sap_patching_register_hdb_server_source_dir_content.files
            | map(attribute='path')
            | map('basename')
            | sort
            | list
            | last
          }}

    # Example: File 'IMDB_SERVER20_089_3-80002031.SAR' results in version '20_089_3'.
    - name: SAP Patching - HDB Server - Prepare - Set fact with extracted server version from SAR file
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_server_version: >-
          {{
            __sap_patching_fact_hdb_server_sar
              | regex_search('(?i)IMDB_SERVER([0-9_]+)-[0-9]{8}\.SAR', '\1')
              | d([], true)
              | first
              | d('', true)
          }}

    - name: SAP Patching - HDB Server - Prepare - Fail if no HDB server version could be extracted from SAR file name
      ansible.builtin.fail:
        msg: |
          FAIL: No HDB server version could be extracted from SAR file name '{{ __sap_patching_fact_hdb_server_sar }}'.
          Please ensure that the SAR file name follows the expected pattern.
          Example: File 'IMDB_SERVER20_089_3-80002031.SAR' results in version '20_089_3'
      when: __sap_patching_fact_hdb_server_version == ''

    - name: SAP Patching - HDB Server - Prepare - Show version extracted from SAR file name
      ansible.builtin.debug:
        msg: >-
          INFO: HDB server version extracted from SAR file name '{{ __sap_patching_fact_hdb_server_sar }}'
          is '{{ __sap_patching_fact_hdb_server_version }}'.
      when: __sap_patching_fact_hdb_server_version != ''

    - name: SAP Patching - HDB Server - Prepare - Set fact with the target HDB server directory
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_server_extract_target:
          "{{ __sap_patching_hdb_server_base }}/{{ __sap_patching_hdb_server_extracted }}_{{ __sap_patching_fact_hdb_server_version }}"

    - name: SAP Patching - HDB Server - Prepare - Create extraction target HDB server directory
      ansible.builtin.file:
        path: "{{ __sap_patching_fact_hdb_server_extract_target }}"
        state: directory
        mode: '0755'
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      when: __sap_patching_fact_hdb_server_version != ''

    - name: SAP Patching - HDB Server - Prepare - Stat availability of the target HDB server directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_hdb_server_extract_target }}"
      register: __sap_patching_register_hdb_server_extract_target_stat

    - name: SAP Patching - HDB Server - Prepare - Fail if target HDB server directory does not exist or is not a directory
      ansible.builtin.fail:
        msg: |
          FAIL: Target HDB server directory '{{ __sap_patching_fact_hdb_server_extract_target }}' does not exist or is not a directory.
      when: not (__sap_patching_register_hdb_server_extract_target_stat.stat.exists
              and __sap_patching_register_hdb_server_extract_target_stat.stat.isdir)

    # Shell is used instead of copy/move modules to ensure we can use globbing
    # to copy file in case they are not in capitals as expected.
    # Copy is used to ensure we do not remove source files.
    - name: SAP Patching - HDB Server - Prepare - Copy all files {{ __direction | d('') }}
      ansible.builtin.shell:
        cmd: >-
          cp '{{ __sap_patching_hdb_server_source }}'/[Ii][Mm][Dd][Bb]_[Ss][Ee][Rr][Vv][Ee][Rr]*
          '{{ __sap_patching_hdb_server_base }}/'
      vars:
        __direction: "from {{ __sap_patching_hdb_server_source }} to {{ __sap_patching_hdb_server_base }}"
      when: __sap_patching_hdb_server_base != __sap_patching_hdb_server_source
      changed_when: true


    - name: SAP Patching - HDB Server - Prepare - Extract HDB server SAR file to the target
      ansible.builtin.command:
        cmd: >-
          {{ __sap_patching_sapcar_path }}/{{ sap_patching_sapcar_file_name }}
          -xvf {{ __sap_patching_hdb_server_base }}/{{ __sap_patching_fact_hdb_server_sar }}
          -R "{{ __sap_patching_fact_hdb_server_extract_target }}"
          -manifest SIGNATURE.SMF
      register: __sap_patching_register_extract_result
      args:
        chdir: "{{ __sap_patching_fact_hdb_server_extract_target }}"
      become: true
      become_user: "{{ __sap_patching_file_owner }}"
      changed_when: "'SAPCAR: processing archive' in __sap_patching_register_extract_result.stdout"
      failed_when: false  # Next task handles failure to provide more information in the error message.

    - name: SAP Patching - HDB Server - Prepare - Fail if extraction of HDB server SAR file failed
      ansible.builtin.fail:
        msg: |
          FAIL: Extraction of HDB server SAR file '{{ __sap_patching_fact_hdb_server_sar }}' failed.
          SAPCAR output: {{ __sap_patching_register_extract_result.stdout | d('') }}
          SAPCAR error: {{ __sap_patching_register_extract_result.stderr | d('') }}
      when: __sap_patching_register_extract_result.rc | d(1) != 0


    - name: SAP Patching - HDB Server - Prepare - Stat availability of the HDB server extracted path
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_hdb_server_extract_target }}/SAP_HANA_DATABASE/server"
      register: __sap_patching_register_hdb_server_extracted_server_dir_stat

    - name: SAP Patching - HDB Server - Prepare - Fail if HDB server extracted path does not exist or is not a directory
      ansible.builtin.fail:
        msg: >-
          FAIL: HDB server directory '{{ __sap_patching_fact_hdb_server_extract_target }}/SAP_HANA_DATABASE/server'
          does not exist or is not a directory.
      when: not (__sap_patching_register_hdb_server_extracted_server_dir_stat.stat.exists
              and __sap_patching_register_hdb_server_extracted_server_dir_stat.stat.isdir)

    - name: SAP Patching - HDB Server - Prepare - Ensure symbolic link for HDB server directory is correct
      ansible.builtin.file:
        src: "{{ __sap_patching_fact_hdb_server_extract_target }}/SAP_HANA_DATABASE"
        dest: "{{ __sap_patching_hdb_server_base }}/{{ sap_patching_hdb_server_to_apply_symlink }}"
        state: link
        force: true
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      become: true
      become_user: "{{ __sap_patching_file_owner }}"

    # This fact is not used in this 'prepare' task, but it is set for the next 'apply' task to use it.
    - name: SAP Patching - HDB Server - Prepare - Set fact with prepared path for further execution tasks
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_server_to_apply_prepared:
          "{{ __sap_patching_fact_hdb_server_extract_target }}/SAP_HANA_DATABASE"


- name: SAP Patching - HDB Server - Prepare - Inform that SAR files were not found
  ansible.builtin.debug:
    msg: |
      No HDB server SAR files found in source directory {{ __sap_patching_hdb_server_source }}.
      Skipping HDB server preparation.
  when:
    - __sap_patching_fact_hdb_server_installed | d(false)
    - __sap_patching_register_hdb_server_source_dir_content.matched | d(0) == 0


# Set the fact from the primary host on all other hosts, so they can verify that the prepared path is visible.
- name: SAP Patching - HDB Server - Prepare - Propagate prepared HDB server path from the primary host
  ansible.builtin.set_fact:
    __sap_patching_fact_hdb_server_to_apply_prepared:
      "{{ hostvars[__sap_patching_fact_hdb_server_primary_host]['__sap_patching_fact_hdb_server_to_apply_prepared'] }}"
  when:
    - __sap_patching_fact_hdb_server_installed | d(false)
    - sap_patching_hdb_server_files_shared
    - inventory_hostname != __sap_patching_fact_hdb_server_primary_host
    - hostvars[__sap_patching_fact_hdb_server_primary_host]['__sap_patching_fact_hdb_server_to_apply_prepared'] is defined


# Runs on every host and checks that the prepared directory is visible on all of them.
- name: Block for all hosts
  when:
    - __sap_patching_fact_hdb_server_installed | d(false)
    - __sap_patching_fact_hdb_server_to_apply_prepared is defined
  block:

    - name: SAP Patching - HDB Server - Prepare - Stat prepared HDB server directory on all hosts
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_hdb_server_to_apply_prepared }}/server"
      register: __sap_patching_register_hdb_server_prepared_stat

    - name: SAP Patching - HDB Server - Prepare - Fail if prepared HDB server is not available on this host
      ansible.builtin.fail:
        msg: |
          FAIL: The prepared HDB server "{{ __sap_patching_fact_hdb_server_to_apply_prepared }}" is not available on this host.
          {% if sap_patching_hdb_server_files_shared %}
          HDB server was prepared only on the elected primary host "{{ __sap_patching_fact_hdb_server_primary_host }}",
          because the variable 'sap_patching_hdb_server_files_shared' is set to 'true'.

          Please ensure that the path defined in the variable 'sap_patching_hdb_server_base'
          is on a shared filesystem mounted on all hosts,
          or set 'sap_patching_hdb_server_files_shared' to 'false' to prepare the HDB server on every host separately.
          {% endif %}
      when: not __sap_patching_register_hdb_server_prepared_stat.stat.exists


- name: SAP Patching - HDB Server - Prepare - Inform that the apply step is not part of the execution plan
  ansible.builtin.debug:
    msg: |
      INFO: Step 'hdb_server_prepare' was completed, but neither the step 'hdb_server_apply'
      nor the step 'hdb_server_update_prepare' is part of the current execution plan.
      The HDB server files are prepared in the path: {{ __sap_patching_fact_hdb_server_to_apply_prepared }}

      When executing the step 'hdb_server_apply' keep current variables identical to use same path,
      or define different using the variable 'sap_patching_hdb_server_to_apply'.
  when:
    - "'hdb_server_apply' not in sap_patching_execution_plan"
    - "'hdb_server_update_prepare' not in sap_patching_execution_plan"
    - __sap_patching_fact_hdb_server_to_apply_prepared is defined
    - inventory_hostname == __sap_patching_fact_hdb_server_primary_host
