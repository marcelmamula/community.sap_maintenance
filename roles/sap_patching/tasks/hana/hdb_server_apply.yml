# SPDX-License-Identifier: Apache-2.0
---

# Explanation for validation handling in apply tasks:
# 1. Detection determines on which hosts in play the HDB server is installed.
# 2. Patching file validations are executed on those hosts and fail if not valid.
# 3. Hosts without the HDB server installed are skipped, so that a single play can contain hosts
#    of different roles. An installation that exists but is not valid still fails.
# 4. Both prepare and apply are idempotent, so a re-run after fixing the installation patches the host.

- name: SAP Patching - HDB Server - Apply - Detect hosts where the HDB server is installed
  ansible.builtin.include_tasks:
    file: hdb_server_detect.yml


# Warning with 'run_once', because all hosts in the play have same fact set.
- name: SAP Patching - HDB Server - Apply - Warning if the HDB server is not installed on any host in play
  ansible.builtin.debug:
    msg: |
      WARN: The HDB server was not found on any host in play, so there is nothing to patch.
      If this is unexpected, ensure that the HDB server hosts are part of this play
      and that the path "{{ sap_patching_hdb_server_install_path }}" is correct.
  run_once: true
  when: __sap_patching_fact_hdb_server_hosts | length == 0


- name: Block for HDB server apply validations
  when: __sap_patching_fact_hdb_server_installed | d(false)
  block:

    # Prepare tasks are doing validation already, but apply can be executed without prepare, so validation must happen again.
    - name: SAP Patching - HDB Server - Apply - Stat availability of the base directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_hdb_server_base }}"
      register: __sap_patching_register_hdb_server_apply_base_stat

    - name: SAP Patching - HDB Server - Apply - Fail if user cannot write to base directory
      ansible.builtin.fail:
        msg: |
          FAIL: The path "{{ sap_patching_hdb_server_base }}" does not exist or is not a directory.
          Please ensure that the path defined in the variable 'sap_patching_hdb_server_base' is a directory.
      when: not (__sap_patching_register_hdb_server_apply_base_stat.stat.exists
              and __sap_patching_register_hdb_server_apply_base_stat.stat.isdir)


    # Facts are set here for improved readability, instead of combining all this logic into one jinja2 block.
    # The path to the HDB server to apply is resolved with the following precedence:
    # 1. If the prepare step was executed, use the freshly prepared HDB server path.
    # 2. If the user did not specify a HDB server to apply, use the default symlink path.
    # 3. If the user specified a HDB server to apply, use that path (relative to base or absolute).

    - name: SAP Patching - HDB Server - Apply - Set fact with HDB server to apply if prepare was executed
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_server_to_apply: "{{ __sap_patching_fact_hdb_server_to_apply_prepared }}"
      when: __sap_patching_fact_hdb_server_to_apply_prepared is defined

    - name: SAP Patching - HDB Server - Apply - Set fact with HDB server to apply if user unspecified
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_server_to_apply:
          "{{ __sap_patching_hdb_server_base }}/{{ sap_patching_hdb_server_to_apply_symlink }}"
      when:
        - __sap_patching_fact_hdb_server_to_apply_prepared is not defined
        - sap_patching_hdb_server_to_apply | trim | length == 0

    - name: SAP Patching - HDB Server - Apply - Set fact with HDB server to apply if user specified
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_server_to_apply: >-
          {{ __sap_patching_hdb_server_base ~ '/' ~ __user_path
            if not __user_path.startswith('/')
            else __user_path }}
      vars:
        __user_path: "{{ sap_patching_hdb_server_to_apply | trim | regex_replace('\\/$', '') }}"
      when:
        - __sap_patching_fact_hdb_server_to_apply_prepared is not defined
        - sap_patching_hdb_server_to_apply | trim | length > 0

    # Prepare tasks prepared all files on all managed nodes, or on first one with shared filesystem.
    # Be it either of those, we still have to ensure that all hosts have access to these files.
    - name: SAP Patching - HDB Server - Apply - Stat availability of extracted HDB server directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_hdb_server_to_apply }}"
      register: __sap_patching_register_hdb_server_to_apply_stat

    - name: SAP Patching - HDB Server - Apply - Fail if HDB server path does not exist and is not a directory or symlink
      ansible.builtin.fail:
        msg: |
          FAIL: The specified HDB server path "{{ __sap_patching_fact_hdb_server_to_apply }}" is not a directory or symlink.
          Please ensure that the HDB server files have been extracted to the shared folder
          and the variable 'sap_patching_hdb_server_to_apply' is set correctly.
      when: not __sap_patching_register_hdb_server_to_apply_stat.stat.exists
              or not (__sap_patching_register_hdb_server_to_apply_stat.stat.isdir
              or __sap_patching_register_hdb_server_to_apply_stat.stat.islnk)

    - name: SAP Patching - HDB Server - Apply - Check the content of {{ __sap_patching_fact_hdb_server_to_apply | d('') }}
      ansible.builtin.find:
        paths: "{{ __sap_patching_fact_hdb_server_to_apply }}"
        file_type: any
      register: __sap_patching_register_hdb_server_to_apply_files

    - name: SAP Patching - HDB Server - Apply - Fail if the HDB server directory is empty
      ansible.builtin.fail:
        msg: |
          FAIL: The directory "{{ __sap_patching_fact_hdb_server_to_apply }}" is empty and patching cannot proceed!
          Ensure that the path points to a valid extracted HDB server, where 'hdblcm' and 'server' executables are present.
      vars:
        __basename_list: "{{ __sap_patching_register_hdb_server_to_apply_files.files | map(attribute='path') | map('basename') | list }}"
      when:
        - __sap_patching_register_hdb_server_to_apply_files.matched | int == 0
          or not ('hdblcm' in __basename_list and 'server' in __basename_list)


    # The cluster is validated before anything is patched, because a cluster which is not running or
    # a wrong clone name is discovered otherwise only after the first site was already patched.
    # Only the modes which set the maintenance mode and relocate the resource need the cluster.
    - name: Block to validate the cluster of the HDB server
      when:
        - sap_patching_hdb_server_is_clustered
        - __sap_patching_params.update_mode | d('') != 'prepare'
      block:

        - name: SAP Patching - HDB Server - Apply - Cluster - Fail if the OS family is not a supported cluster shell
          ansible.builtin.fail:
            msg: |
              FAIL: Cluster management is not implemented for the OS family "{{ ansible_facts['os_family'] }}".
              Supported OS families are: {{ __sap_patching_hdb_cluster_cmd.keys() | join(', ') }}.
              Set the variable 'sap_patching_hdb_server_is_clustered' to 'false' to patch without cluster handling.
          when: ansible_facts['os_family'] not in __sap_patching_hdb_cluster_cmd

        - name: SAP Patching - HDB Server - Apply - Cluster - Get details about available services
          ansible.builtin.service_facts:

        # A service which is not installed is not part of the gathered facts, so both the missing
        # package and the stopped service are reported by the same task.
        - name: SAP Patching - HDB Server - Apply - Cluster - Fail if the cluster services are not running
          ansible.builtin.fail:
            msg: |
              FAIL: The cluster services are not running on this host, so the database cannot be patched with cluster handling.
              State of 'corosync.service': {{ __sap_patching_corosync_state }}
              State of 'pacemaker.service': {{ __sap_patching_pacemaker_state }}
              Ensure that the cluster is installed and running on this host,
              or set the variable 'sap_patching_hdb_server_is_clustered' to 'false' to patch without cluster handling.
          vars:
            __sap_patching_corosync_state:
              "{{ ansible_facts['services']['corosync.service'].state | d('not installed') }}"
            __sap_patching_pacemaker_state:
              "{{ ansible_facts['services']['pacemaker.service'].state | d('not installed') }}"
          when:
            - __sap_patching_corosync_state != 'running'
              or __sap_patching_pacemaker_state != 'running'

        # 'crm_resource' is a Pacemaker command, so the same check works with both cluster shells.
        - name: SAP Patching - HDB Server - Apply - Cluster - Locate the clone resource in the cluster configuration
          ansible.builtin.command:
            cmd: crm_resource --locate --resource {{ sap_patching_hdb_server_cluster_saphana_clone_name }}
          become: true
          register: __sap_patching_register_hdb_cluster_locate
          changed_when: false
          failed_when: false  # Fail is handled in the next task to provide more information.

        - name: SAP Patching - HDB Server - Apply - Cluster - Fail if the cluster resource is not running
          ansible.builtin.fail:
            msg: |
              FAIL: The cluster resource '{{ sap_patching_hdb_server_cluster_saphana_clone_name }}' is not running on this host.
              Possible causes are that this host is not a member of the cluster, that the name of the
              clone resource is wrong, or that the resource is stopped or in maintenance mode.
              Ensure that the resource is running, because the patching sets the maintenance mode of
              the cluster and relocates the resource to the site which was patched first,
              or set the variable 'sap_patching_hdb_server_is_clustered' to 'false' to patch without cluster handling.
              Command executed: crm_resource --locate --resource {{ sap_patching_hdb_server_cluster_saphana_clone_name }}
              Stdout: {{ __sap_patching_register_hdb_cluster_locate.stdout | d('') }}
              Stderr: {{ __sap_patching_register_hdb_cluster_locate.stderr | d('') }}
              Message: {{ __sap_patching_register_hdb_cluster_locate.msg | d('') }}
          when:
            - __sap_patching_register_hdb_cluster_locate.rc | d(1) != 0
              or 'NOT running' in __sap_patching_register_hdb_cluster_locate.stdout | d('')


# Detection above already reported and skipped hosts without a valid HDB server installation.
- name: Block for HDB server apply execution when HDB server installation directory is present
  when: __sap_patching_fact_hdb_server_installed | d(false)
  block:

    - name: SAP Patching - HDB Server - Apply - Check System Replication Status
      ansible.builtin.shell:
        cmd: >-
          source /usr/sap/{{ __sap_patching_fact_hdb_server_sid }}/home/.sapenv.sh &&
          {{ sap_patching_hdb_server_install_path }}/hdbnsutil
          -sr_state
          -sapcontrol=1
      become: true
      become_user: "{{ __sap_patching_fact_hdb_server_sidadm_user }}"
      register: __sap_patching_register_hdb_hsr_sr_state_initial
      changed_when: false
      failed_when: false  # Fail is handled in the next task to provide more information.

    - name: SAP Patching - HDB Server - Apply - Fail if HSR state does not allow for patching
      ansible.builtin.fail:
        msg: |
          FAIL: SAP HANA System Replication detection shows status that does not allow patching.
          Command executed: {{ sap_patching_hdb_server_install_path }}/hdbnsutil -sr_state -sapcontrol=1
          Stdout: {{ __sap_patching_register_hdb_hsr_sr_state_initial.stdout | d('') }}
          Stderr: {{ __sap_patching_register_hdb_hsr_sr_state_initial.stderr | d('') }}
      when:
        - "'SAPCONTROL-OK' not in __sap_patching_register_hdb_hsr_sr_state_initial.stdout | d('')
            or __sap_patching_register_hdb_hsr_sr_state_initial.rc | d(1) != 0
            or 'online=true' not in __sap_patching_register_hdb_hsr_sr_state_initial.stdout | d('')"

    - name: SAP Patching - HDB Server - Apply - HSR - Set fact if HSR is enabled
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_hsr_enabled: >-
          {{ true if 'mode=none' not in __sap_patching_register_hdb_hsr_sr_state_initial.stdout else false }}

    # The replication and the cluster handling are executed only on the elected host,
    # so all HDB server hosts in play have to be part of the same replication.
    - name: SAP Patching - HDB Server - Apply - HSR - Fail if HSR is not enabled on all HDB server hosts in play
      ansible.builtin.fail:
        msg: |
          FAIL: SAP HANA System Replication was not detected on all HDB server hosts.
          Hosts with replication: {{ __sap_patching_hsr_hosts_enabled | join(', ') }}
          Hosts without replication:
          {{ __sap_patching_fact_hdb_server_hosts | difference(__sap_patching_hsr_hosts_enabled) | join(', ') }}
          Patch the hosts with and without replication in separate plays.
      vars:
        __sap_patching_hsr_hosts_enabled: >-
          {{ __sap_patching_fact_hdb_server_hosts
             | map('extract', hostvars)
             | selectattr('__sap_patching_fact_hdb_hsr_enabled', 'defined')
             | selectattr('__sap_patching_fact_hdb_hsr_enabled')
             | map(attribute='inventory_hostname')
             | list }}
      when:
        - inventory_hostname == __sap_patching_fact_hdb_server_primary_host
        - __sap_patching_hsr_hosts_enabled | length > 0
        - __sap_patching_hsr_hosts_enabled | length != __sap_patching_fact_hdb_server_hosts | length

    # Since 'sr_state' can return different modes, we check for all other than 'none'. Examples:
    # mode=primary
    # mode=sync
    - name: Block for when HSR is enabled
      when: __sap_patching_fact_hdb_hsr_enabled | d(false)
      block:
        # NOTE: The site tiers are sorted as strings, so a tier 10 would be sorted before a tier 2.
        # This is not handled, because ten replication tiers are an unrealistic landscape.
        # Reason for noqa: Jinja spacing would squash all lines to left, making it unreadable.
        - name: SAP Patching - HDB Server - Apply - HSR Enabled - Set facts with parsed sr_state output  # noqa jinja[spacing]
          ansible.builtin.set_fact:
            __sap_patching_fact_hdb_hsr_sites: >-
              {{
                __sap_patching_register_hdb_hsr_sr_state_initial.stdout_lines
                | select('match', '^siteTier/')
                | map('regex_search', '^siteTier/(.+)=(.+)$', '\1','\2')
                | sort(attribute=1, reverse=true)
              }}

            __sap_patching_fact_hdb_hsr_site_to_host: >-
              {% set pairs_list = [] %}
              {%- for line in __sap_patching_register_hdb_hsr_sr_state_initial.stdout_lines -%}
                {% if line is match('^mapping/.+=(.+)/(.+)$') %}
                  {%- set parts_by_equals = line.split('=') -%}
                  {%- set parts_by_slash = parts_by_equals[1].split('/') -%}
                  {%- set key_pair = pairs_list.append({'key': parts_by_slash[0], 'value': parts_by_slash[1]}) -%}
                {% endif %}
              {%- endfor -%}
              {{ pairs_list | items2dict }}

        # Reason for noqa: Jinja spacing would squash all lines to left, making it unreadable.
        - name: SAP Patching - HDB Server - Apply - HSR Enabled - Set fact with dictionary of hostname and FQDN of hosts  # noqa jinja[spacing]
          ansible.builtin.set_fact:
            __sap_patching_fact_hdb_host_fqdn: >-
              {% set host_pairs = [] %}
              {%- for host in ansible_play_hosts_all -%}
                {%- set short_name = host.split('.')[0] -%}
                {%- set key_pair = host_pairs.append({'key': short_name, 'value': host}) -%}
              {%- endfor -%}
              {{ host_pairs | items2dict }}


        # Recorded before the patching starts, because a cluster relocation breaks the replication of
        # the site which is the primary now, and the parameters to register it again are lost with it.
        # Executed on the elected host only, because all tasks of the include are delegated anyway.
        # 'run_once' would select the first host of the play, which does not have to be a HDB server host.
        - name: SAP Patching - HDB Server - Apply - HSR Enabled - Record the initial replication parameters of all sites
          ansible.builtin.include_tasks:
            file: common/hdb_hsr_status_initial.yml
          when:
            - inventory_hostname == __sap_patching_fact_hdb_server_primary_host
            - __sap_patching_params.update_mode != 'prepare'


        - name: SAP Patching - HDB Server - Apply - HSR Enabled - Activate the HANA SYSTEM user
          ansible.builtin.include_tasks:
            file: common/hdb_system_user.yml
          vars:
            __sap_patching_hdb_system_user_action: ACTIVATE
          when:
            - sap_patching_hdb_server_activate_system_user
            # Ensure that it is executed only on primary node, which should be node with lowest site tier value.
            # 'last' returns lowest SiteTier value and 'first' returns hostname.
            - __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_fact_hdb_hsr_sites | last | first ] == ansible_facts['hostname']
            # - __sap_patching_params.update_mode != 'prepare'


        - name: SAP Patching - HDB Server - Apply - HSR Enabled - Set fact with the initial cluster relocation status
          ansible.builtin.set_fact:
            __sap_patching_fact_hdb_cluster_relocated: false

        # Skipping HSR Enabled hosts if they don't belong to the current inventory (some sites may not be present on this run).
        - name: SAP Patching - HDB Server - Apply - HSR Enabled - Loop through HANA DB sites from highest to lowest tier and apply the patch
          ansible.builtin.include_tasks:
            file: hdb_server_apply_patch.yml
          loop: "{{ __sap_patching_fact_hdb_hsr_sites }}"
          loop_control:
            loop_var: __sap_patching_hdb_hsr_site
            label: "{{ __sap_patching_hdb_hsr_site | join('/') }}"
          vars:
            __sap_patching_delegated_hdb_server_host:
              "{{ __sap_patching_fact_hdb_host_fqdn[__sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_hdb_hsr_site[0]]] }}"
          when:
            # All tasks of the include are delegated to the host of the patched site, so the loop is
            # executed on the elected host only, which also keeps the facts of both in the same place.
            - inventory_hostname == __sap_patching_fact_hdb_server_primary_host
            - __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_hdb_hsr_site[0]] in __sap_patching_fact_hdb_host_fqdn


        # Have re-read the HSR status after patching all sites as the primary may have changed (if clustered and on primary/secondary cluster)
        # or it may not have changed (if just HSR without clustering)
        - name: Block to validate the HSR state after patching
          when:
            - __sap_patching_params.update_mode != 'prepare'
          block:
            # 3: Third 'sr_state' check after patching to see if the replication is still active and the system is online.
            - name: SAP Patching - HDB Server - Apply - HSR Enabled - Check System Replication Status after patching
              ansible.builtin.shell:
                cmd: >-
                  source /usr/sap/{{ __sap_patching_fact_hdb_server_sid }}/home/.sapenv.sh &&
                  {{ sap_patching_hdb_server_install_path }}/hdbnsutil
                  -sr_state
                  -sapcontrol=1
              become: true
              become_user: "{{ __sap_patching_fact_hdb_server_sidadm_user }}"
              register: __sap_patching_register_hdb_hsr_sr_state_validated
              changed_when: false
              failed_when: false  # Fail is handled in the next task to provide more information.

            - name: SAP Patching - HDB Server - Apply - HSR Enabled - Fail if HSR state is not valid after patching
              ansible.builtin.fail:
                msg: |
                  FAIL: Status of SAP HANA System Replication is not valid after patching.
                  Command executed: {{ sap_patching_hdb_server_install_path }}/hdbnsutil -sr_state -sapcontrol=1
                  Stdout: {{ __sap_patching_register_hdb_hsr_sr_state_validated.stdout | d('') }}
                  Stderr: {{ __sap_patching_register_hdb_hsr_sr_state_validated.stderr | d('') }}
              when:
                - "'SAPCONTROL-OK' not in __sap_patching_register_hdb_hsr_sr_state_validated.stdout | d('')
                    or __sap_patching_register_hdb_hsr_sr_state_validated.rc | d(1) != 0
                    or 'online=true' not in __sap_patching_register_hdb_hsr_sr_state_validated.stdout | d('')"

            # NOTE: The site tiers are sorted as strings, so a tier 10 would be sorted before a tier 2.
            # This is not handled, because ten replication tiers are an unrealistic landscape.
            # Reason for noqa: Jinja spacing would squash all lines to left, making it unreadable.
            - name: SAP Patching - HDB Server - Apply - HSR Enabled - Set facts with parsed sr_state output after patching  # noqa jinja[spacing]
              ansible.builtin.set_fact:
                __sap_patching_fact_hdb_hsr_sites: >-
                  {{
                    __sap_patching_register_hdb_hsr_sr_state_validated.stdout_lines
                    | select('match', '^siteTier/')
                    | map('regex_search', '^siteTier/(.+)=(.+)$', '\1','\2')
                    | sort(attribute=1, reverse=true)
                  }}

                __sap_patching_fact_hdb_hsr_site_to_host: >-
                  {% set pairs_list = [] %}
                  {%- for line in __sap_patching_register_hdb_hsr_sr_state_validated.stdout_lines -%}
                    {% if line is match('^mapping/.+=(.+)/(.+)$') %}
                      {%- set parts_by_equals = line.split('=') -%}
                      {%- set parts_by_slash = parts_by_equals[1].split('/') -%}
                      {%- set key_pair = pairs_list.append({'key': parts_by_slash[0], 'value': parts_by_slash[1]}) -%}
                    {% endif %}
                  {%- endfor -%}
                  {{ pairs_list | items2dict }}
              when: "'mode=none' not in __sap_patching_register_hdb_hsr_sr_state_validated.stdout | d('')"


        # Deactivation is done after the validation above, because a cluster relocation during the
        # patching may have moved the primary site to another host than the one which activated the user.
        - name: SAP Patching - HDB Server - Apply - HSR Enabled - Deactivate the HANA SYSTEM user
          ansible.builtin.include_tasks:
            file: common/hdb_system_user.yml
          vars:
            __sap_patching_hdb_system_user_action: DEACTIVATE
          when:
            - sap_patching_hdb_server_activate_system_user | bool
            # Ensure that it is executed only on primary node, which should be node with lowest site tier value.
            # 'last' returns lowest SiteTier value and 'first' returns hostname.
            - __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_fact_hdb_hsr_sites | last | first ] == ansible_facts['hostname']


    - name: Block when HSR is not enabled
      when: not __sap_patching_fact_hdb_hsr_enabled | d(false)
      block:
        - name: SAP Patching - HDB Server - Apply - HSR Disabled - Activate the HANA SYSTEM user
          ansible.builtin.include_tasks:
            file: common/hdb_system_user.yml
          vars:
            __sap_patching_hdb_system_user_action: ACTIVATE
          when: sap_patching_hdb_server_activate_system_user


        # __sap_patching_delegated_hdb_server_host is set here only for compatibility
        # with the task file which is used for both HSR and no HSR.
        - name: SAP Patching - HDB Server - Apply - HSR Disabled - Proceed with patching
          ansible.builtin.include_tasks:
            file: hdb_server_apply_patch.yml
          vars:
            __sap_patching_delegated_hdb_server_host: "{{ inventory_hostname }}"


        - name: SAP Patching - HDB Server - Apply - HSR Disabled - Deactivate the HANA SYSTEM user
          ansible.builtin.include_tasks:
            file: common/hdb_system_user.yml
          vars:
            __sap_patching_hdb_system_user_action: DEACTIVATE
          when: sap_patching_hdb_server_activate_system_user


  # The rescue reports the state the cluster was left in, because the maintenance mode is enabled
  # for the whole patching. It has to fail again, otherwise the error of the task above would be
  # considered handled and the remaining steps of the execution plan would continue.
  rescue:
    - name: SAP Patching - HDB Server - Apply - Fail with the cluster state after a failed patching
      ansible.builtin.fail:
        msg: |
          FAIL: The HDB server patching failed with the error shown above.
          {% if __sap_patching_fact_hdb_cluster_in_maintenance | d(false) | bool %}
          The SAP HANA cluster is still in maintenance mode, so its resources are not managed
          and no takeover is possible. Repair the system and disable the maintenance mode with:
          {% if ansible_facts['os_family'] == 'Suse' %}
          crm --force configure property maintenance-mode=false
          {% else %}
          pcs property set maintenance-mode=false
          {% endif %}
          {% else %}
          The cluster maintenance mode is disabled.
          Ensure that all cluster resources are online and running before running the role again.
          {% endif %}
