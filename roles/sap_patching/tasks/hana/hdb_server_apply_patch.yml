# SPDX-License-Identifier: Apache-2.0
---

# Block for actual patching of HDB server.
- name: Block to propagate delegated host to all tasks in this block
  delegate_to: "{{ __sap_patching_delegated_hdb_server_host }}"
  block:
    - name: SAP Patching - HDB Server - Apply - Show host and site information
      ansible.builtin.debug:
        msg: |
          {% if __sap_patching_fact_hdb_hsr_enabled | d(false) %}
          INFO: Patching HDB server '{{ __sap_patching_delegated_hdb_server_host }}' on site '{{ __sap_patching_hdb_hsr_site[0] }}'.
          {% else %}
          INFO: Patching HDB server '{{ __sap_patching_delegated_hdb_server_host }}' (no HSR).
          {% endif %}

    - name: SAP Patching - HDB Server - Apply - Set fact with hdblcm action parameter
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_server_hdblcm_action: >-
          {% if __sap_patching_params.update_mode | d('') == 'prepare' %}
          --action=update --prepare_update
          {% else %}
          --action=update
          {% endif %}
    # {% elif __sap_patching_params.update_mode == 'resume' %}
    # --action=update --resume_update

    # If clustered and not in prepare mode then put cluster in maintenance mode.
    # Variable values ('false' and 'true') are strings, not booleans.
    - name: SAP Patching - HDB Server - Apply - Cluster - Enable maintenance mode for SAP HANA resource
      ansible.builtin.include_tasks:
        file: common/hdb_cluster_maintenance.yml
      vars:
        __sap_patching_hdb_cluster_maintenance_mode: 'true'
      when:
        - sap_patching_hdb_server_is_clustered
        - __sap_patching_params.update_mode | d('') != 'prepare'
        - inventory_hostname == __sap_patching_fact_hdb_server_primary_host


    - name: SAP Patching - HDB Server - Apply - Include task file to generate hdblcm config file template
      ansible.builtin.include_tasks:
        file: common/hdblcm_configfile.yml


    - name: SAP Patching - HDB Server - Apply - Inform about the hdblcm command to be executed
      ansible.builtin.debug:
        msg: |
          INFO: HDB Server patching will be executed with the hdblcm command
          using configfile: '{{ __sap_patching_fact_hdb_hdblcm_configfile }}'
          NOTE: This task reports no progress and Ansible may seem unresponsive until the hdblcm process completes.

    - name: SAP Patching - HDB Server - Apply - Update HDB server using 'hdblcm'
      ansible.builtin.command:
        cmd: >-
          {{ __sap_patching_fact_hdb_server_to_apply }}/hdblcm
          {{ __sap_patching_fact_hdb_server_hdblcm_action }}
          -s {{ __sap_patching_fact_hdb_server_sid }}
          --batch
          {{ '--system_user=' + sap_patching_hdb_server_cf_system_user
            if sap_patching_hdb_server_cf_system_user | d('', true) | length > 0 else '' }}
          --configfile={{ __sap_patching_fact_hdb_hdblcm_configfile }}
      register: __sap_patching_register_hdb_server_hdblcm_output
      # args:
      #   chdir: '"{{ __sap_patching_fact_hdb_server_to_apply }}"'
      become: true
      changed_when:
        - "('SAP HANA Database components updated' in __sap_patching_register_hdb_server_hdblcm_output.stdout
          or 'Update of SAP HANA Database components prepared' in __sap_patching_register_hdb_server_hdblcm_output.stdout)"
        - __sap_patching_register_hdb_server_hdblcm_output.rc == 0
      failed_when: false  # Fail is handled in the next task to provide more information.

    - name: SAP Patching - HDB Server - Apply - Fail if 'hdblcm' command failed
      ansible.builtin.fail:
        msg: |
          FAIL: Execution of HDB server update with 'hdblcm' command has failed.
          Command executed: {{ __sap_patching_register_hdb_server_hdblcm_output.cmd | d('') }}
          Stdout: {{ __sap_patching_register_hdb_server_hdblcm_output.stdout | d('') }}
          Stderr: {{ __sap_patching_register_hdb_server_hdblcm_output.stderr | d('') }}
      when:
        - "'failed' in __sap_patching_register_hdb_server_hdblcm_output.stderr | d('')
          or __sap_patching_register_hdb_server_hdblcm_output.rc | d(1) != 0"


# Block for HSR specific tasks.
- name: Block to propagate delegated host to all tasks in this block
  delegate_to: "{{ __sap_patching_delegated_hdb_server_host }}"
  block:
    # We are inside the HSR loop, but the primary/master site may have switched if we are in a cluster and patching the primary/secondary pair
    # So we need to re-check the HSR status and make sure we know who is the current primary
    - name: Block to refresh HSR information
      when:
        - __sap_patching_params.update_mode != 'prepare'
        - __sap_patching_fact_hdb_hsr_enabled | d(false)
      block:
        # 2: Second 'sr_state' check after patching to identify primary again.
        - name: SAP Patching - HDB Server - Apply - Check System Replication Status to update primary site information
          ansible.builtin.shell:
            cmd: >-
              source /usr/sap/{{ __sap_patching_fact_hdb_server_sid }}/home/.sapenv.sh &&
              {{ sap_patching_hdb_server_install_path }}/hdbnsutil
              -sr_state
              -sapcontrol=1
          become: true
          become_user: "{{ __sap_patching_fact_hdb_server_sidadm_user }}"
          register: __sap_patching_register_hdb_hsr_sr_state_refreshed
          changed_when: false
          failed_when: false  # Fail is handled in the next task to provide more information.

        - name: SAP Patching - HDB Server - Apply - Fail if HSR state was not obtained successfully
          ansible.builtin.fail:
            msg: |
              FAIL: Status of SAP HANA System Replication does not allow for patching.
              Command executed: {{ sap_patching_hdb_server_install_path }}/hdbnsutil -sr_state -sapcontrol=1
              Stdout: {{ __sap_patching_register_hdb_hsr_sr_state_refreshed.stdout | d('') }}
              Stderr: {{ __sap_patching_register_hdb_hsr_sr_state_refreshed.stderr | d('') }}
          when:
            - "'SAPCONTROL-OK' not in __sap_patching_register_hdb_hsr_sr_state_refreshed.stdout | d('')
              or __sap_patching_register_hdb_hsr_sr_state_refreshed.rc | d(1) != 0"


        - name: Block for when HSR is enabled
          when: "'mode=none' not in __sap_patching_register_hdb_hsr_sr_state_refreshed.stdout"
          block:
            - name: SAP Patching - HDB Server - Apply - HSR - Fail if HSR is not online
              ansible.builtin.fail:
                msg: |
                  FAIL: SAP HANA System Replication is enabled but offline.
                  Unable to proceed with patching.
                  Stdout: {{ __sap_patching_register_hdb_hsr_sr_state_refreshed.stdout | d('') }}
              when: "'online=true' not in __sap_patching_register_hdb_hsr_sr_state_refreshed.stdout"

            # NOTE: The site tiers are sorted as strings, so a tier 10 would be sorted before a tier 2.
            # This is not handled, because ten replication tiers are an unrealistic landscape.
            # Reason for noqa: Jinja spacing would squash all lines to left, making it unreadable.
            - name: SAP Patching - HDB Server - Apply - HSR - Set facts with parsed sr_state output after patching  # noqa jinja[spacing]
              ansible.builtin.set_fact:
                __sap_patching_fact_hdb_hsr_sites_refreshed: >-
                  {{
                    __sap_patching_register_hdb_hsr_sr_state_refreshed.stdout_lines
                    | select('match', '^siteTier/')
                    | map('regex_search', '^siteTier/(.+)=(.+)$', '\1','\2')
                    | sort(attribute=1, reverse=true)
                  }}

                __sap_patching_fact_hdb_hsr_site_to_host_refreshed: >-
                  {% set pairs_list = [] %}
                  {%- for line in __sap_patching_register_hdb_hsr_sr_state_refreshed.stdout_lines -%}
                    {% if line is match('^mapping/.+=(.+)/(.+)$') %}
                      {%- set parts_by_equals = line.split('=') -%}
                      {%- set parts_by_slash = parts_by_equals[1].split('/') -%}
                      {%- set key_pair = pairs_list.append({'key': parts_by_slash[0], 'value': parts_by_slash[1]}) -%}
                    {% endif %}
                  {%- endfor -%}
                  {{ pairs_list | items2dict }}


            # The replication state is reported by the master site only, which is the site with the lowest tier and which should be up.
            # It is checked there if it is part of the current inventory and if it is not the site which was just patched,
            # because that one reports the state of its own services only. Otherwise 'hdbcons' on the current site is used below.
            - name: SAP Patching - HDB Server - Apply - HSR - Wait until the replication is active on the master site
              ansible.builtin.include_tasks:
                file: common/hdb_hsr_status.yml
              vars:
                __primary_1: "{{ __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_hdb_hsr_site[0]] }}"
                __primary_2: "{{ __sap_patching_fact_hdb_hsr_site_to_host_refreshed[__sap_patching_fact_hdb_hsr_sites_refreshed | last | first] }}"
                __sap_patching_hsr_status_host: "{{ __sap_patching_fact_hdb_host_fqdn[__primary_2] | d(inventory_hostname) }}"
              when:
                - __primary_2 in ansible_play_hosts | map('split', '.') | map('first') | list
                - __primary_2 != __primary_1


            # <sid>adm@hdbserver01:/usr/sap/<SID>/HDB00> hdbcons "replication info"
            # | grep ReplicationStatus_ | awk -F ':' '{print $2}' | sed -n 's/.*ReplicationStatus_\(.*\)/\1/p'
            # Error
            # Active
            # Syncing
            # If we couldn't get HSR status above (typically because master site is not in the current inventory) we try hdbcons instead.
            # This is less reliable as the step above if the system is both source and target of replication i.e. in a middle of the chain
            # Loop 30 times with 20 second delay until replication is active
            - name: SAP Patching - HDB Server - Apply - HSR - Get replication state using 'hdbcons' on the current site
              ansible.builtin.shell:
                cmd: >-
                  set -o pipefail && source ~/.profile &&
                  hdbcons "replication info"
                  | grep ReplicationStatus_
                  | awk -F ':' '{print $2}'
                  | sed -n 's/.*ReplicationStatus_\(.*\)/\1/p'
              args:
                executable: /bin/bash
              register: __sap_patching_register_hdb_hsr_sr_status_hdbcons
              become: true
              become_user: "{{ __sap_patching_fact_hdb_server_sidadm_user }}"
              retries: 30
              delay: 20
              until:
                - "'Error' not in __sap_patching_register_hdb_hsr_sr_status_hdbcons.stdout
                  and 'Syncing' not in __sap_patching_register_hdb_hsr_sr_status_hdbcons.stdout"
              vars:
                __primary_1: "{{ __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_hdb_hsr_site[0]] }}"
                __primary_2: "{{ __sap_patching_fact_hdb_hsr_site_to_host_refreshed[__sap_patching_fact_hdb_hsr_sites_refreshed | last | first] }}"
              # The last condition is evaluated only when the check on the master site was executed,
              # so it never reads the return code of a previous site. Return code 15 means that the
              # replication of all services is active, anything else was not reported by the master site.
              when:
                - __primary_2 not in ansible_play_hosts | map('split', '.') | map('first') | list
                  or __primary_2 == __primary_1
                  or __sap_patching_register_hdb_hsr_status.rc != 15
              changed_when: false

            - name: SAP Patching - HDB Server - Apply - HSR - Fail if 'hdbcons' failed to return replication status
              ansible.builtin.fail:
                msg: |
                  FAIL: Execution of 'hdbcons' has failed.
                  Command executed: hdbcons "replication info"
                  Stdout: {{ __sap_patching_register_hdb_hsr_sr_status_hdbcons.stdout | d('') }}
                  Stderr: {{ __sap_patching_register_hdb_hsr_sr_status_hdbcons.stderr | d('') }}
              # A skipped task registers as well, but only with 'skipped' and without any output.
              when:
                - not __sap_patching_register_hdb_hsr_sr_status_hdbcons.skipped | d(false)
                - __sap_patching_register_hdb_hsr_sr_status_hdbcons.stdout | d('') | length == 0


# Block for cluster specific tasks.
- name: Block to propagate delegated host to all tasks in this block
  delegate_to: "{{ __sap_patching_delegated_hdb_server_host }}"
  block:
    - name: Block for cluster
      when:
        - sap_patching_hdb_server_is_clustered
        - __sap_patching_params.update_mode | d('') != 'prepare'
        - inventory_hostname == __sap_patching_fact_hdb_server_primary_host
      block:

        # If clustered and not in prepare mode then put cluster out of maintenance mode
        # 'false/true' are strings, not booleans
        - name: SAP Patching - HDB Server - Apply - Cluster - Disable maintenance mode for SAP HANA resource
          ansible.builtin.include_tasks:
            file: common/hdb_cluster_maintenance.yml
          vars:
            __sap_patching_hdb_cluster_maintenance_mode: 'false'

        # The relocation is done only after the first patched site, which is the secondary site with
        # the highest tier. It takes over, so all remaining sites are patched as secondary sites.
        # The site which is the primary now is demoted by the takeover and is repaired if needed.
        - name: SAP Patching - HDB Server - Apply - Cluster - Relocate the HDB resource to the patched site
          ansible.builtin.include_tasks:
            file: common/hdb_cluster_relocate.yml
          vars:
            __sap_patching_hdb_relocate_demoted_site: "{{ __sap_patching_fact_hdb_hsr_sites_refreshed | last | first }}"
            __sap_patching_hdb_relocate_promoted_site: "{{ __sap_patching_hdb_hsr_site[0] }}"
            __sap_patching_hdb_relocate_promoted_host: "{{ __sap_patching_delegated_hdb_server_host }}"
            __sap_patching_hdb_relocate_demoted_host: >-
              {{ __sap_patching_fact_hdb_host_fqdn[
                   __sap_patching_fact_hdb_hsr_site_to_host_refreshed[__sap_patching_hdb_relocate_demoted_site]] }}
          when:
            - __sap_patching_fact_hdb_hsr_enabled | d(false)
            - not __sap_patching_fact_hdb_cluster_relocated | d(false, true)
