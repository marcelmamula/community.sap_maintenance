---
# Sample plays for ABAP kernel patching with the Ansible Role sap_patching.
# See the role README for the description of the steps and the variables.
#
# The inventory groups 'p4h', 'q4h', 's4h' and 'd4h' are examples of one group per SAP system.
# Replace them with the group of the system which is patched.

# Prepare the latest kernel from the source directory, apply it and restart with a Rolling Kernel Switch.
# NOTE: With the 'rks' strategy 'saproot.sh' is not executed by the role and has to be
#       executed manually after all instances have been restarted.
- name: Ansible Play for ABAP kernel patching - Latest kernel with Rolling Kernel Switch
  hosts: p4h
  become: true
  any_errors_fatal: true
  tasks:
    - name: Execute Ansible Role sap_patching
      ansible.builtin.include_role:
        name: sap_patching
      vars:
        sap_patching_sapcar_path: /install
        sap_patching_sapcar_file_name: SAPCAR.EXE
        sap_patching_sap_system_sid: P4H
        sap_patching_execution_plan:
          - abap_kernel_prepare
          - abap_kernel_apply
          - abap_kernel_restart
        sap_patching_kernel_prepare_version: autodetect
        sap_patching_kernel_base: /install/kernel
        sap_patching_kernel_source: /install/kernel/source
        sap_patching_kernel_restart_strategy: rks


# Apply kernel 7.93 patch 330, which was prepared by an earlier run, and restart the whole system.
- name: Ansible Play for ABAP kernel patching - Already prepared kernel with full restart
  hosts: q4h
  become: true
  any_errors_fatal: true
  tasks:
    - name: Execute Ansible Role sap_patching
      ansible.builtin.include_role:
        name: sap_patching
      vars:
        sap_patching_sap_system_sid: Q4H
        sap_patching_execution_plan:
          - abap_kernel_apply
          - abap_kernel_restart
        sap_patching_kernel_base: /install/kernel
        sap_patching_kernel_source: /install/kernel/source
        sap_patching_kernel_restart_strategy: all
        sap_patching_kernel_to_apply: k793p330


# Add files like R3trans or tp on top of the already prepared kernel 793p330, without changing its patch level.
# The apply and restart steps are omitted to keep the example short, they can be added to the plan.
- name: Ansible Play for ABAP kernel patching - Append files to a prepared kernel
  hosts: s4h
  become: true
  any_errors_fatal: true
  tasks:
    - name: Execute Ansible Role sap_patching
      ansible.builtin.include_role:
        name: sap_patching
      vars:
        sap_patching_sap_system_sid: S4H
        sap_patching_execution_plan:
          - abap_kernel_prepare
        sap_patching_kernel_base: /install/kernel
        sap_patching_kernel_source: /install/kernel/source
        sap_patching_kernel_prepare_append_to_version: 793p330


# Prepare the kernel on a system without a shared staging filesystem.
# The SAR files are copied from '/software/kernel/source' on the control node to
# 'sap_patching_kernel_source' on every host and they are extracted on every host separately.
- name: Ansible Play for ABAP kernel patching - Prepare from the control node without a shared filesystem
  hosts: d4h
  become: true
  any_errors_fatal: true
  tasks:
    - name: Execute Ansible Role sap_patching
      ansible.builtin.include_role:
        name: sap_patching
      vars:
        sap_patching_sap_system_sid: D4H
        sap_patching_execution_plan:
          - abap_kernel_prepare
        sap_patching_kernel_base: /install/kernel
        sap_patching_kernel_source: /install/kernel/source
        sap_patching_kernel_source_local: /software/kernel/source
        sap_patching_kernel_files_on_target: false
        sap_patching_kernel_files_shared: false
