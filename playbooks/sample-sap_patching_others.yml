---
# Sample plays for SAP HANA client, SAP Host Agent and SAP Web Dispatcher patching
# with the Ansible Role sap_patching.
# See the role README for the description of the steps and the variables.
#
# The inventory groups 's4h', 'p4h' and 'wdp' are examples of one group per SAP system.
# Replace them with the group of the system which is patched.

# Update the HANA database client, with a full stop and start of the ABAP system around the update.
- name: Ansible Play for SAP HANA client patching - Latest version with ABAP downtime
  hosts: s4h
  become: true
  any_errors_fatal: true
  tasks:
    - name: Execute Ansible Role sap_patching
      ansible.builtin.include_role:
        name: sap_patching
      vars:
        sap_patching_sap_system_sid: S4H
        sap_patching_hdb_client_base: /install/hanadb/client
        sap_patching_hdb_client_source: /install/hanadb/client/source
        sap_patching_execution_plan:
          - hdb_client_prepare
          - abap_stop_system
          - hdb_client_apply
          - abap_start_system

# Update the SAP Host Agent by copying the new version into the autoupdate directory,
# where the running host agents pick it up. See SAP Note 1473974.
- name: Ansible Play for SAP Host Agent patching - Autoupdate
  hosts: p4h
  become: true
  any_errors_fatal: true
  tasks:
    - name: Execute Ansible Role sap_patching
      ansible.builtin.include_role:
        name: sap_patching
      vars:
        sap_patching_sap_system_sid: P4H
        sap_patching_sapcar_path: /install
        sap_patching_sapcar_file_name: SAPCAR.EXE
        sap_patching_host_agent_base: /install/hostagents
        sap_patching_host_agent_source: /install/hostagents/source
        sap_patching_host_agent_autoupdate_path: /install/HostAgentUpdateDir
        sap_patching_execution_plan:
          - host_agent_prepare
          - host_agent_apply_auto


# Update the SAP Web Dispatcher and restart its instances.
- name: Ansible Play for SAP Web Dispatcher patching - Latest version with restart
  hosts: wdp
  become: true
  any_errors_fatal: true
  tasks:
    - name: Execute Ansible Role sap_patching
      ansible.builtin.include_role:
        name: sap_patching
      vars:
        sap_patching_sap_system_sid: WDP
        sap_patching_sapcar_path: /install
        sap_patching_sapcar_file_name: SAPCAR.EXE
        sap_patching_webdisp_base: /install/webdisp
        sap_patching_webdisp_source: /install/webdisp/source
        sap_patching_execution_plan:
          - webdisp_prepare
          - webdisp_apply
          - webdisp_restart
