---
# Sample plays for SAP HANA database patching with the Ansible Role sap_patching.
# See the role README for the description of the steps and the variables.
#
# The inventory groups 'hs4', 'hq4' and 'hp4' are examples of one group per HANA database.
# Replace them with the group of the database which is patched.

# Update to the latest version in the source directory in one run.
- name: Ansible Play for SAP HANA patching - Latest version in one run
  hosts: hs4
  become: true
  any_errors_fatal: true
  tasks:
    - name: Execute Ansible Role sap_patching
      ansible.builtin.include_role:
        name: sap_patching
      vars:
        sap_patching_sap_system_sid: HS4
        sap_patching_hdb_server_base: /install/hanadb/server
        sap_patching_hdb_server_source: /install/hanadb/server/source
        sap_patching_hdb_server_activate_system_user: false
        sap_patching_execution_plan:
          - hdb_server_prepare
          - hdb_server_apply


# The same update split into two runs, to shorten the downtime.
# The first run stops before the downtime phase and it can be executed while the database is in use.
- name: Ansible Play for SAP HANA patching - Preparation before the downtime window
  hosts: hq4
  become: true
  any_errors_fatal: true
  tasks:
    - name: Execute Ansible Role sap_patching
      ansible.builtin.include_role:
        name: sap_patching
      vars:
        sap_patching_sap_system_sid: HQ4
        sap_patching_hdb_server_base: /install/hanadb/server
        sap_patching_hdb_server_source: /install/hanadb/server/source
        sap_patching_hdb_server_activate_system_user: false
        sap_patching_execution_plan:
          - hdb_server_prepare
          - hdb_server_update_prepare


# The second run of the split update, executed during the downtime window.
- name: Ansible Play for SAP HANA patching - Update during the downtime window
  hosts: hq4
  become: true
  any_errors_fatal: true
  tasks:
    - name: Execute Ansible Role sap_patching
      ansible.builtin.include_role:
        name: sap_patching
      vars:
        sap_patching_sap_system_sid: HQ4
        sap_patching_hdb_server_base: /install/hanadb/server
        sap_patching_hdb_server_source: /install/hanadb/server/source
        sap_patching_hdb_server_activate_system_user: false
        sap_patching_execution_plan:
          - hdb_server_apply


# Update of a clustered database, including the activation of the SYSTEM user before the update
# and its deactivation afterwards.
- name: Ansible Play for SAP HANA patching - Clustered database with SYSTEM user activation
  hosts: hp4
  become: true
  any_errors_fatal: true
  tasks:
    - name: Execute Ansible Role sap_patching
      ansible.builtin.include_role:
        name: sap_patching
      vars:
        sap_patching_sap_system_sid: HP4
        sap_patching_hdb_server_base: /install/hanadb/server
        sap_patching_hdb_server_source: /install/hanadb/server/source
        sap_patching_hdb_server_activate_system_user: true
        sap_patching_hdb_server_activate_admin_userstore_key: HDB_SYSTEMDB
        # Alternative to the user store key:
        # sap_patching_hdb_server_activate_admin_user: <admin user>
        # sap_patching_hdb_server_activate_admin_password: <admin user password>
        sap_patching_hdb_server_is_clustered: true
        sap_patching_hdb_server_cluster_saphana_clone_name: mst_SAPHanaCon_HP4_HDB00
        sap_patching_execution_plan:
          - hdb_server_prepare
          - hdb_server_apply
